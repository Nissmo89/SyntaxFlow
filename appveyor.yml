version: 1.0.{build}

image: Visual Studio 2022

platform:
  - x64

configuration:
  - Release

clone_depth: 1

environment:
  QT_VERSION: "6.8.0"
  QT_ARCH: "win64_msvc2022_64"
  QT_PATH: 'C:\Qt\6.8.0\msvc2022_64'
  Qt6_DIR: 'C:\Qt\6.8.0\msvc2022_64\lib\cmake\Qt6'

init:
  - set "VSWHERE=%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe"
  - if not exist "%VSWHERE%" ( echo [ERROR] vswhere.exe not found & exit 1 )
  - for /f "usebackq tokens=*" %%i in (`"%VSWHERE%" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VS_PATH=%%i"
  - if "%VS_PATH%"=="" ( echo [ERROR] Visual Studio installation not found & exit 1 )
  - echo [OK] Visual Studio found at %VS_PATH%
  - call "%VS_PATH%\Common7\Tools\VsDevCmd.bat" -arch=x64

install:
  - ps: Install-Product node 22
  - set "PATH=%QT_PATH%\bin;%PATH%"
  - echo Checking for Qt at %QT_PATH%...
  - if not exist "%QT_PATH%" C:\Python310-x64\python.exe -m pip install --upgrade pip
  - if not exist "%QT_PATH%" C:\Python310-x64\python.exe -m pip install aqtinstall
  - if not exist "%QT_PATH%" C:\Python310-x64\python.exe -m aqt install-qt windows desktop %QT_VERSION% %QT_ARCH% --outputdir C:\Qt --modules qtwebengine qtwebchannel qtpositioning --external 7z
  - if exist "%QT_PATH%" echo Qt %QT_VERSION% is present.
  - echo ==========================================
  - echo Environment Information:
  - qmake --version
  - cmake --version
  - ninja --version
  - where cl
  - cl
  - echo ==========================================

before_build:
  - if exist build-windows rmdir /S /Q build-windows
  - mkdir build-windows
  - cd build-windows
  - cmake .. -G Ninja -DCMAKE_BUILD_TYPE=Release -DPRECACHE_WASM_ENGINES=ON -DCMAKE_PREFIX_PATH="%Qt6_DIR%"
  - cd ..
  - cd copilot_bridge
  - npm install
  - cd ..

build_script:
  - cd build-windows
  - cmake --build . --config Release --parallel
  - cd ..

after_build:
  - echo ==========================================
  - echo Packaging Application
  - echo ==========================================
  - set "EXE_DIR=build-windows"
  - if exist "build-windows\Release\SyntaxFlow.exe" set "EXE_DIR=build-windows\Release"
  - if not exist "%EXE_DIR%\SyntaxFlow.exe" ( echo [ERROR] SyntaxFlow.exe not found & exit 1 )
  - echo [OK] SyntaxFlow.exe found in %EXE_DIR%
  - mkdir package
  - copy "%EXE_DIR%\SyntaxFlow.exe" package\
  - for /R build-windows %%F in (*.dll) do if not "%%~dpF"=="%CD%\package\" copy /Y "%%F" package\
  - if exist "%EXE_DIR%\problems" xcopy /E /I /Y "%EXE_DIR%\problems" package\problems
  - if exist "%EXE_DIR%\problems.json" copy /Y "%EXE_DIR%\problems.json" package\
  - if exist "%EXE_DIR%\style.css" copy /Y "%EXE_DIR%\style.css" package\
  - if exist "%EXE_DIR%\fonts" xcopy /E /I /Y "%EXE_DIR%\fonts" package\fonts
  - if exist "%EXE_DIR%\web_editor" xcopy /E /I /Y "%EXE_DIR%\web_editor" package\web_editor
  - if exist "%EXE_DIR%\wasi-sdk" xcopy /E /I /Y "%EXE_DIR%\wasi-sdk" package\wasi-sdk
  - xcopy /E /I /Y "copilot_bridge" package\copilot_bridge
  - C:\Python310-x64\python.exe scripts\setup_wasm_tools.py
  - xcopy /E /I /Y "tools\wasmer" package\tools\wasmer
  - curl -sL -o package\node.exe https://nodejs.org/dist/v22.14.0/win-x64/node.exe
  - for /R build-windows %%F in (qt6*.dll) do copy /Y "%%F" "%QT_PATH%\bin\"
  - call "%QT_PATH%\bin\windeployqt.exe" --release --no-translations package\SyntaxFlow.exe
  - if not exist "package\SyntaxFlow.exe" ( echo [ERROR] SyntaxFlow.exe missing after deployment & exit 1 )
  - if not exist "package\Qt6Core.dll" ( echo [ERROR] Qt6Core.dll missing after deployment & exit 1 )
  - 7z a -tzip "SyntaxFlow-Windows-x64.zip" ".\package\*"
  - if not exist "SyntaxFlow-Windows-x64.zip" ( echo [ERROR] ZIP file not created & exit 1 )

artifacts:
  - path: SyntaxFlow-Windows-x64.zip
    name: SyntaxFlow-Windows-x64

test: off
