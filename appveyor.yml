version: 1.0.{build}

image: Visual Studio 2022

platform:
  - x64

configuration:
  - Release

clone_depth: 1

init:
  - call "C:\Program Files\Microsoft Visual Studio\2022\Community\Common7\Tools\VsDevCmd.bat" -arch=x64

install:
  # Install the same Qt version used by the GitHub Actions build
  - python -m pip install --upgrade pip
  - python -m pip install aqtinstall

  - python -m aqt install-qt windows desktop 6.8.0 win64_msvc2022_64 --modules qtwebengine qtwebchannel qtpositioning

  # Make Qt available to CMake and the build environment
  - set QTDIR=C:\Qt\6.8.0\msvc2022_64
  - set Qt6_DIR=C:\Qt\6.8.0\msvc2022_64\lib\cmake\Qt6
  - set CMAKE_PREFIX_PATH=C:\Qt\6.8.0\msvc2022_64

  # Diagnostics
  - echo QTDIR=%QTDIR%
  - where cmake
  - cmake --version
  - where cl
  - cl
  - qmake --version

before_build:
  # Show the important Qt installation
  - dir "%QTDIR%\bin"
  - dir "%QTDIR%\lib\cmake\Qt6"

  # Configure
  - cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_PREFIX_PATH="%QTDIR%" -DSYNTAXFLOW_QT_PREFIX="%QTDIR%" -DSYNTAXFLOW_USE_QWINDOWKIT=ON -DSYNTAXFLOW_REQUIRE_QWINDOWKIT=ON -DSYNTAXFLOW_FETCH_QWINDOWKIT=ON -DPRECACHE_WASM_ENGINES=OFF

build_script:
  - cmake --build build --config Release --parallel

after_build:
  # Find the executable
  - dir /s /b build\SyntaxFlow.exe
  - dir /s /b build\Release\SyntaxFlow.exe

  # Deploy Qt DLLs/plugins
  - if exist "build\Release\SyntaxFlow.exe" "%QTDIR%\bin\windeployqt.exe" --release --no-translations --no-system-d3d-compiler --no-opengl-sw "build\Release\SyntaxFlow.exe"
  - if exist "build\SyntaxFlow.exe" "%QTDIR%\bin\windeployqt.exe" --release --no-translations --no-system-d3d-compiler --no-opengl-sw "build\SyntaxFlow.exe"

  # Create distribution directory
  - mkdir package

  # Copy application output
  - if exist "build\Release\SyntaxFlow.exe" xcopy /E /I /Y "build\Release\*" "package\"
  - if exist "build\SyntaxFlow.exe" xcopy /E /I /Y "build\*" "package\"

  # Copy runtime assets explicitly
  - xcopy /E /I /Y "problems" "package\problems"
  - copy /Y "problems.json" "package\problems.json"
  - copy /Y "libs\qtext_browser\style.css" "package\style.css"
  - xcopy /E /I /Y "libs\qtext_browser\fonts" "package\fonts"
  - xcopy /E /I /Y "web_editor" "package\web_editor"

  # Package
  - 7z a -tzip "SyntaxFlow-Windows-x64.zip" ".\package\*"

artifacts:
  - path: SyntaxFlow-Windows-x64.zip
    name: SyntaxFlow-Windows-x64

test: off