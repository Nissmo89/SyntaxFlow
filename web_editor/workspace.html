  // ─── SAFE & CLEAN MATH FORMULA & LATEX PARSER ───
  function renderMathToHtml(rawTex, isDisplay) {
    if (!rawTex) return '';
    let s = rawTex.trim();

    // 1. Math cal / fonts
    s = s.replace(/\\mathcal\{([a-zA-Z])\}/g, '<span class="sf-math-cal">$1</span>');
    s = s.replace(/\\mathbb\{([a-zA-Z])\}/g, '<span class="sf-math-bb">$1</span>');
    s = s.replace(/\\mathbf\{([^}]+)\}/g, '<strong>$1</strong>');
    s = s.replace(/\\mathit\{([^}]+)\}/g, '<em>$1</em>');
    s = s.replace(/\\(?:mathrm|text)\{([^}]+)\}/g, '<span class="sf-math-text">$1</span>');

    // 2. Fractions: \frac{a}{b} -> nested
    let fracLimit = 5;
    while (/\\frac\{([^{}]+)\}\{([^{}]+)\}/.test(s) && fracLimit-- > 0) {
      s = s.replace(/\\frac\{([^{}]+)\}\{([^{}]+)\}/g, '<span class="sf-math-frac"><span class="sf-math-num-frac">$1</span><span class="sf-math-den-frac">$2</span></span>');
    }

    // 3. Roots: \sqrt[n]{x} and \sqrt{x}
    s = s.replace(/\\sqrt\[([^\]]+)\]\{([^}]+)\}/g, '<span class="sf-math-sqrt"><sup>$1</sup>√<span class="sf-math-body">$2</span></span>');
    s = s.replace(/\\sqrt\{([^}]+)\}/g, '<span class="sf-math-sqrt">√<span class="sf-math-body">$1</span></span>');

    // 4. Standard Math Functions
    s = s.replace(/\\(log|ln|lg|exp|sin|cos|tan|arcsin|arccos|arctan|min|max|gcd|lcm|det|deg|dim|lim|sup|inf)\b/g, '<span class="sf-math-func">$1</span>');

    // 5. Greek Letters
    const greekMap = {
      'alpha': 'α', 'beta': 'β', 'gamma': 'γ', 'delta': 'δ', 'epsilon': 'ε', 'varepsilon': 'ε',
      'zeta': 'ζ', 'eta': 'η', 'theta': 'θ', 'vartheta': 'ϑ', 'iota': 'ι', 'kappa': 'κ',
      'lambda': 'λ', 'mu': 'μ', 'nu': 'ν', 'xi': 'ξ', 'pi': 'π', 'rho': 'ρ', 'sigma': 'σ',
      'tau': 'τ', 'upsilon': 'υ', 'phi': 'φ', 'varphi': 'ϕ', 'chi': 'χ', 'psi': 'ψ', 'omega': 'ω',
      'Gamma': 'Γ', 'Delta': 'Δ', 'Theta': 'Θ', 'Lambda': 'Λ', 'Xi': 'Ξ', 'Pi': 'Π', 'Sigma': 'Σ',
      'Upsilon': 'Υ', 'Phi': 'Φ', 'Psi': 'Ψ', 'Omega': 'Ω'
    };
    s = s.replace(/\\(alpha|beta|gamma|delta|epsilon|varepsilon|zeta|eta|theta|vartheta|iota|kappa|lambda|mu|nu|xi|pi|rho|sigma|tau|upsilon|phi|varphi|chi|psi|omega|Gamma|Delta|Theta|Lambda|Xi|Pi|Sigma|Upsilon|Phi|Psi|Omega)\b/g, (m, g) => greekMap[g] || m);

    // 6. Relational & Operator Symbols
    const symbolMap = {
      'leq': '≤', 'le': '≤', 'geq': '≥', 'ge': '≥', 'neq': '≠', 'ne': '≠',
      'approx': '≈', 'equiv': '≡', 'sim': '∼', 'simeq': '≃', 'cong': '≅',
      'times': '×', 'cdot': '·', 'pm': '±', 'mp': '∓', 'div': '÷',
      'in': '∈', 'notin': '∉', 'subset': '⊂', 'subseteq': '⊆', 'supset': '⊃', 'supseteq': '⊇',
      'cup': '∪', 'cap': '∩', 'setminus': '∖',
      'to': '→', 'rightarrow': '→', 'leftarrow': '←', 'Rightarrow': '⇒', 'Leftarrow': '⇐',
      'iff': '⇔', 'Leftrightarrow': '⇔', 'mapsto': '↦',
      'infty': '∞', 'sum': '∑', 'prod': '∏', 'int': '∫', 'partial': '∂', 'nabla': '∇',
      'forall': '∀', 'exists': '∃', 'nexists': '∄', 'emptyset': '∅',
      'ldots': '…', 'cdots': '⋯', 'dots': '…', 'circ': '∘', 'bullet': '•', 'star': '⋆',
      'langle': '⟨', 'rangle': '⟩', 'lfloor': '⌊', 'rfloor': '⌋', 'lceil': '⌈', 'rceil': '⌉',
      'prime': '′', 'quad': '  ', 'qquad': '    '
    };
    s = s.replace(/\\(leq|le|geq|ge|neq|ne|approx|equiv|sim|simeq|cong|times|cdot|pm|mp|div|in|notin|subset|subseteq|supset|supseteq|cup|cap|setminus|to|rightarrow|leftarrow|Rightarrow|Leftarrow|iff|Leftrightarrow|mapsto|infty|sum|prod|int|partial|nabla|forall|exists|nexists|emptyset|ldots|cdots|dots|circ|bullet|star|langle|rangle|lfloor|rfloor|lceil|rceil|prime|quad|qquad)\b/g, (m, g) => symbolMap[g] !== undefined ? symbolMap[g] : m);

    // 7. Strip delimiters and spacing macros
    s = s.replace(/\\left\s*([(\[{|])/g, '$1').replace(/\\right\s*([)\]}|])/g, '$1');
    s = s.replace(/\\left\./g, '').replace(/\\right\./g, '');
    s = s.replace(/\\\{/g, '{').replace(/\\\}/g, '}');
    s = s.replace(/\\([,;:!])/g, ' ');

    // 8. Superscripts & Subscripts
    s = s.replace(/\^\{([^}]+)\}/g, '<sup>$1</sup>');
    s = s.replace(/_\{([^}]+)\}/g, '<sub>$1</sub>');
    s = s.replace(/\^([0-9a-zA-Z+-]+)/g, '<sup>$1</sup>');
    s = s.replace(/_([0-9a-zA-Z+-]+)/g, '<sub>$1</sub>');

    if (isDisplay) {
      return `<div class="sf-math sf-math-block">${s}</div>`;
    }
    return `<span class="sf-math sf-math-inline">${s}</span>`;
  }

  // Register Marked Extensions for Math once
  if (window.marked && !window._sfMarkedMathConfigured) {
    window._sfMarkedMathConfigured = true;
    marked.use({
      extensions: [
        {
          name: 'inlineMath',
          level: 'inline',
          start(src) {
            const idx1 = src.indexOf('$');
            const idx2 = src.indexOf('\\(');
            if (idx1 === -1) return idx2;
            if (idx2 === -1) return idx1;
            return Math.min(idx1, idx2);
          },
          tokenizer(src) {
            const doubleMatch = /^\$\$([\s\S]+?)\$\$/.exec(src);
            if (doubleMatch) {
              return {
                type: 'inlineMath',
                raw: doubleMatch[0],
                text: doubleMatch[1].trim(),
                display: true
              };
            }
            const parenMatch = /^\\\(([\s\S]+?)\\\)/.exec(src);
            if (parenMatch) {
              return {
                type: 'inlineMath',
                raw: parenMatch[0],
                text: parenMatch[1].trim(),
                display: false
              };
            }
            const singleMatch = /^\$((?:\\\$|[^\$\n\r])+?)\$/.exec(src);
            if (singleMatch) {
              const content = singleMatch[1].trim();
              if (content && !/^\s/.test(singleMatch[1]) && !/\s$/.test(singleMatch[1])) {
                return {
                  type: 'inlineMath',
                  raw: singleMatch[0],
                  text: content,
                  display: false
                };
              }
            }
          },
          renderer(token) {
            return renderMathToHtml(token.text, token.display);
          }
        },
        {
          name: 'blockMath',
          level: 'block',
          start(src) {
            const idx1 = src.indexOf('$$');
            const idx2 = src.indexOf('\\[');
            if (idx1 === -1) return idx2;
            if (idx2 === -1) return idx1;
            return Math.min(idx1, idx2);
          },
          tokenizer(src) {
            const match = /^(?:\$\$([\s\S]+?)\$\$|\\\[([\s\S]+?)\\\])(?:\n+|$)/.exec(src);
            if (match) {
              return {
                type: 'blockMath',
                raw: match[0],
                text: (match[1] || match[2]).trim()
              };
            }
          },
          renderer(token) {
            return renderMathToHtml(token.text, true);
          }
        }
      ]
    });
  }

  // ─── CLIPBOARD COPY HELPER ───
  window.copyTextToClipboard = function(text, btnEl) {
    if (!text) return;
    const doFeedback = () => {
      if (btnEl) {
        btnEl.classList.add('copied');
        const textSpan = btnEl.querySelector('span');
        const origText = textSpan ? textSpan.textContent : '';
        if (textSpan) textSpan.textContent = 'Copied!';
        setTimeout(() => {
          btnEl.classList.remove('copied');
          if (textSpan) textSpan.textContent = origText || 'Copy';
        }, 1800);
      }
    };

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(doFeedback).catch(() => {
        fallbackCopy(text);
        doFeedback();
      });
    } else {
      fallbackCopy(text);
      doFeedback();
    }
  };

  function fallbackCopy(text) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.top = '-9999px';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    try {
      document.execCommand('copy');
    } catch (e) {}
    document.body.removeChild(ta);
  }

  function normalizeMarkdown(text) {
    if (!text) return '';
    let res = text;
    // 1. Unescape literal escape sequences if present
    if (res.indexOf('\\n') !== -1) {
      res = res.replace(/\\r\\n/g, '\n').replace(/\\n/g, '\n');
    }
    if (res.indexOf('\\t') !== -1) {
      res = res.replace(/\\t/g, '    ');
    }
    if (res.indexOf('\\"') !== -1) {
      res = res.replace(/\\"/g, '"');
    }
    if (res.indexOf("\\'") !== -1) {
      res = res.replace(/\\'/g, "'");
    }

    // 2. Clean LeetCode codeblock language tags e.g. ```java [] -> ```java or ```python3 [tab1] -> ```python3
    res = res.replace(/```\s*([\w#+-]+)\s*\[.*?\]/g, '```$1');

    // 3. If the entire content is raw code without markdown backticks or headings, wrap it in a code block
    const trimmed = res.trim();
    if (!trimmed.includes('```') && !trimmed.startsWith('#') && (
      trimmed.includes('class Solution') || 
      trimmed.includes('def ') || 
      trimmed.includes('public class') || 
      trimmed.includes('class ') ||
      trimmed.includes('#include') || 
      trimmed.includes('function ') ||
      trimmed.includes('var ') ||
      trimmed.includes('let ') ||
      trimmed.includes('const ')
    )) {
      res = '```\n' + trimmed + '\n```';
    }

    return res;
  }

  // ─── DOM ENHANCER FOR RENDERED MARKDOWN ───
  function enhanceRenderedMarkdown(containerEl) {
    if (!containerEl) return;

    // A. Multi-Language Implementations Tabbed Code Switcher
    const knownLanguages = [
      'c++', 'cpp', 'python', 'python 3', 'python3', 'py', 'java', 'javascript', 'js',
      'typescript', 'ts', 'rust', 'rs', 'golang', 'go', 'c#', 'csharp', 'c', 'swift',
      'kotlin', 'ruby', 'php', 'scala'
    ];

    const headings = Array.from(containerEl.querySelectorAll('h1, h2, h3, h4'));
    let tabGroupCounter = 0;

    for (const h of headings) {
      const hText = (h.textContent || '').trim().toLowerCase();
      const isMultiLangHeader = hText.includes('multi-language') || hText.includes('implementations') || hText.includes('solution code');

      // Check if we have consecutive language headings after this heading or standalone
      let langItems = [];
      let sibling = h.nextElementSibling;

      if (isMultiLangHeader) {
        while (sibling && !['H1', 'H2'].includes(sibling.tagName)) {
          const nextSib = sibling.nextElementSibling;
          if (['H3', 'H4', 'H5'].includes(sibling.tagName)) {
            const langName = sibling.textContent.trim();
            if (nextSib && (nextSib.tagName === 'PRE' || nextSib.querySelector('pre'))) {
              const preEl = nextSib.tagName === 'PRE' ? nextSib : nextSib.querySelector('pre');
              langItems.push({
                name: langName,
                hEl: sibling,
                preEl: preEl,
                containerEl: nextSib
              });
              sibling = nextSib.nextElementSibling;
              continue;
            }
          }
          sibling = nextSib;
        }
      }

      // If we collected 2 or more language implementations, turn them into tabbed container
      if (langItems.length >= 2) {
        tabGroupCounter++;
        const tabsId = `sf-code-tabs-${Date.now()}-${tabGroupCounter}`;

        const tabsContainer = document.createElement('div');
        tabsContainer.className = 'code-tabs-container';
        tabsContainer.id = tabsId;

        // Determine default active language matching editor
        let activeEditorLang = (document.getElementById('langSelect')?.value || '').toLowerCase();
        let defaultActiveIdx = 0;
        langItems.forEach((item, idx) => {
          const lName = item.name.toLowerCase();
          if (activeEditorLang === 'python' || activeEditorLang === 'py') {
            if (lName.includes('python')) defaultActiveIdx = idx;
          } else if (activeEditorLang === 'javascript' || activeEditorLang === 'js') {
            if (lName.includes('javascript') || lName.includes('js')) defaultActiveIdx = idx;
          } else if (activeEditorLang === 'rust' || activeEditorLang === 'rs') {
            if (lName.includes('rust')) defaultActiveIdx = idx;
          } else if (activeEditorLang === 'java') {
            if (lName.includes('java') && !lName.includes('script')) defaultActiveIdx = idx;
          } else if (activeEditorLang === 'cpp' || activeEditorLang === 'c++') {
            if (lName.includes('c++') || lName.includes('cpp')) defaultActiveIdx = idx;
          } else if (activeEditorLang === 'go') {
            if (lName.includes('go')) defaultActiveIdx = idx;
          }
        });

        // Build Nav Buttons
        const navHtml = langItems.map((item, idx) => {
          const isActive = idx === defaultActiveIdx ? 'active' : '';
          return `<button class="code-tab-btn ${isActive}" onclick="switchCodeTab('${tabsId}', ${idx})">${item.name}</button>`;
        }).join('');

        const headerHtml = `
          <div class="code-tabs-header">
            <div class="code-tabs-nav">${navHtml}</div>
            <div class="code-tab-tools">
              <button class="code-copy-btn" onclick="copyActiveTabCode(this, '${tabsId}')" title="Copy code">
                <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
                <span>Copy</span>
              </button>
            </div>
          </div>
        `;

        // Build Panes
        const bodyEl = document.createElement('div');
        bodyEl.className = 'code-tabs-body';

        langItems.forEach((item, idx) => {
          const paneEl = document.createElement('div');
          paneEl.className = `code-tab-pane ${idx === defaultActiveIdx ? 'active' : ''}`;
          paneEl.innerHTML = `<div class="code-tab-pane-title">${item.name}</div>`;
          paneEl.appendChild(item.preEl.cloneNode(true));
          bodyEl.appendChild(paneEl);
        });

        tabsContainer.innerHTML = headerHtml;
        tabsContainer.appendChild(bodyEl);

        // Replace original elements
        if (langItems[0].hEl && langItems[0].hEl.parentNode) {
          langItems[0].hEl.parentNode.insertBefore(tabsContainer, langItems[0].hEl);
        }
        langItems.forEach(item => {
          if (item.hEl && item.hEl.parentNode) item.hEl.parentNode.removeChild(item.hEl);
          if (item.containerEl && item.containerEl.parentNode) item.containerEl.parentNode.removeChild(item.containerEl);
        });
      }
    }

    // B. Standalone Code Blocks Header & Copy Button
    const allPres = Array.from(containerEl.querySelectorAll('pre'));
    for (const pre of allPres) {
      if (pre.closest('.code-tabs-container') || pre.closest('.code-block-wrapper')) continue;

      const codeEl = pre.querySelector('code');
      let langName = 'CODE';
      if (codeEl) {
        const cls = codeEl.className || '';
        const match = /language-([a-zA-Z0-9#+-]+)/.exec(cls);
        if (match) {
          langName = match[1].toUpperCase();
          if (langName === 'CPP') langName = 'C++';
          else if (langName === 'PYTHON') langName = 'PYTHON 3';
          else if (langName === 'JS') langName = 'JAVASCRIPT';
          else if (langName === 'TS') langName = 'TYPESCRIPT';
        }
      }

      const wrapper = document.createElement('div');
      wrapper.className = 'code-block-wrapper';

      const header = document.createElement('div');
      header.className = 'code-block-header';
      header.innerHTML = `
        <span>${langName}</span>
        <button class="code-copy-btn" onclick="copyPreCode(this)" title="Copy code">
          <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
          <span>Copy</span>
        </button>
      `;

      pre.parentNode.insertBefore(wrapper, pre);
      wrapper.appendChild(header);
      wrapper.appendChild(pre);
    }

    // C. Complexity Analysis Metric Cards
    const complexityHeadings = Array.from(containerEl.querySelectorAll('h2, h3')).filter(h => {
      const txt = (h.textContent || '').toLowerCase();
      return txt.includes('complexity analysis') || txt.includes('complexity');
    });

    for (const compH of complexityHeadings) {
      let compList = compH.nextElementSibling;
      while (compList && !['UL', 'OL', 'P', 'DIV'].includes(compList.tagName) && !['H1', 'H2', 'H3'].includes(compList.tagName)) {
        compList = compList.nextElementSibling;
      }

      if (compList && (compList.tagName === 'UL' || compList.tagName === 'OL')) {
        const listItems = Array.from(compList.children);
        let timeItem = null;
        let spaceItem = null;

        listItems.forEach(li => {
          const text = li.innerHTML || '';
          if (/time\s*complexity/i.test(text)) timeItem = li;
          else if (/space\s*complexity/i.test(text)) spaceItem = li;
        });

        if (timeItem || spaceItem) {
          const grid = document.createElement('div');
          grid.className = 'complexity-grid';

          const createCard = (type, liEl) => {
            const isTime = type === 'time';
            const iconSvg = isTime
              ? `<svg class="complexity-icon" viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg>`
              : `<svg class="complexity-icon" viewBox="0 0 24 24"><path d="M15 9H9v6h6V9zm-2 4h-2v-2h2v2zm8-2V9h-2V7c0-1.1-.9-2-2-2h-2V3h-2v2h-2V3H9v2H7c-1.1 0-2 .9-2 2v2H3v2h2v2H3v2h2v2c0 1.1.9 2 2 2h2v2h2v-2h2v2h2v-2h2c1.1 0 2-.9 2-2v-2h2v-2h-2v-2h2zm-4 6H7V7h10v10z"/></svg>`;
            
            let htmlContent = (liEl.innerHTML || '').trim();
            if (htmlContent.startsWith('<p>') && htmlContent.endsWith('</p>')) {
              htmlContent = htmlContent.slice(3, -4).trim();
            }

            // Clean out the leading bold "Time Complexity:" or "Space Complexity:"
            htmlContent = htmlContent.replace(/^(?:<strong[^>]*>)?\s*(?:Time|Space)\s*Complexity\s*:?\s*(?:<\/strong>)?\s*:?\s*/i, '').trim();

            // Extract primary metric formula if at start
            let metricBadge = '';
            const mathMatch = htmlContent.match(/^\s*(<span class="sf-math[^"]*">[\s\S]*?<\/span>)/i);
            if (mathMatch) {
              metricBadge = mathMatch[1];
              htmlContent = htmlContent.substring(mathMatch[0].length).replace(/^[\s,:-]+/, '').trim();
            } else {
              const plainMatch = htmlContent.match(/^\s*(O\s*\([^)]+\))/i);
              if (plainMatch) {
                metricBadge = `<span class="sf-math sf-math-inline">${plainMatch[1]}</span>`;
                htmlContent = htmlContent.substring(plainMatch[0].length).replace(/^[\s,:-]+/, '').trim();
              }
            }

            if (htmlContent && htmlContent[0] && /[a-z]/.test(htmlContent[0])) {
              htmlContent = htmlContent[0].toUpperCase() + htmlContent.slice(1);
            }

            return `
              <div class="complexity-card complexity-${type}">
                <div class="complexity-header">
                  <div class="complexity-title-wrap">
                    ${iconSvg}
                    <span>${isTime ? 'Time Complexity' : 'Space Complexity'}</span>
                  </div>
                  ${metricBadge}
                </div>
                <div class="complexity-desc">${htmlContent}</div>
              </div>
            `;
          };

          if (timeItem) grid.innerHTML += createCard('time', timeItem);
          if (spaceItem) grid.innerHTML += createCard('space', spaceItem);

          compList.parentNode.insertBefore(grid, compList);
          compList.parentNode.removeChild(compList);
        }
      }
    }

    // D. Callouts / Admonitions
    const blockquotes = Array.from(containerEl.querySelectorAll('blockquote'));
    for (const bq of blockquotes) {
      const rawText = bq.textContent.trim();
      let type = null;
      let title = '';

      if (rawText.startsWith('[!NOTE]') || /^\*\*Note:?\*\*/i.test(rawText)) {
        type = 'note'; title = 'Note';
      } else if (rawText.startsWith('[!TIP]') || /^\*\*Tip:?\*\*/i.test(rawText)) {
        type = 'tip'; title = 'Tip';
      } else if (rawText.startsWith('[!IMPORTANT]') || /^\*\*Important:?\*\*/i.test(rawText)) {
        type = 'important'; title = 'Important';
      } else if (rawText.startsWith('[!WARNING]') || /^\*\*Warning:?\*\*/i.test(rawText)) {
        type = 'warning'; title = 'Warning';
      } else if (rawText.startsWith('[!CAUTION]') || /^\*\*Caution:?\*\*/i.test(rawText)) {
        type = 'caution'; title = 'Caution';
      }

      if (type) {
        const callout = document.createElement('div');
        callout.className = `sf-callout sf-callout-${type}`;

        let bodyHtml = bq.innerHTML
          .replace(/\[!(NOTE|TIP|IMPORTANT|WARNING|CAUTION)\]/i, '')
          .replace(/<strong>\s*(?:Note|Tip|Important|Warning|Caution):?\s*<\/strong>/i, '')
          .trim();

        const iconSvg = `<svg class="sf-callout-icon" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>`;

        callout.innerHTML = `
          <div class="sf-callout-header">
            ${iconSvg}
            <span>${title}</span>
          </div>
          <div class="sf-callout-body">${bodyHtml}</div>
        `;
        bq.parentNode.insertBefore(callout, bq);
        bq.parentNode.removeChild(bq);
      }
    }

    // E. Edge Cases Cards
    const edgeHeadings = Array.from(containerEl.querySelectorAll('h2, h3')).filter(h => {
      const txt = (h.textContent || '').toLowerCase();
      return txt.includes('edge cases') || txt.includes('pitfalls') || txt.includes('corner cases');
    });

    for (const eh of edgeHeadings) {
      let nextList = eh.nextElementSibling;
      while (nextList && !['OL', 'UL'].includes(nextList.tagName) && !['H1', 'H2', 'H3'].includes(nextList.tagName)) {
        nextList = nextList.nextElementSibling;
      }
      if (nextList && (nextList.tagName === 'OL' || nextList.tagName === 'UL')) {
        Array.from(nextList.children).forEach(li => {
          const match = li.innerHTML.match(/^\s*<strong>([^<]+)<\/strong>:?\s*(.*)$/i);
          if (match) {
            li.innerHTML = `<span class="edge-case-title">${match[1]}</span> <span>${match[2]}</span>`;
            li.classList.add('edge-case-card');
          }
        });
      }
    }

    // F. Table Wrappers
    const tables = Array.from(containerEl.querySelectorAll('table'));
    for (const tbl of tables) {
      if (!tbl.closest('.table-wrapper')) {
        const wrap = document.createElement('div');
        wrap.className = 'table-wrapper';
        tbl.parentNode.insertBefore(wrap, tbl);
        wrap.appendChild(tbl);
      }
    }
  }

  function renderMarkdown(targetId, markdown) {
    const cleanMarkdown = normalizeMarkdown(markdown);
    marked.setOptions({
      gfm: true,
      breaks: true,
      highlight: function(code, lang) {
        if (lang) {
          const cleanLang = lang.replace(/\s*\[.*\]/, '').trim().toLowerCase();
          const langMap = {
            'c++': 'cpp',
            'c#': 'csharp',
            'python3': 'python',
            'python': 'python',
            'py': 'python',
            'js': 'javascript',
            'javascript': 'javascript',
            'ts': 'typescript',
            'typescript': 'typescript',
            'golang': 'go',
            'go': 'go',
            'java': 'java',
            'rust': 'rust',
            'rs': 'rust'
          };
          const resolvedLang = langMap[cleanLang] || cleanLang;
          if (hljs.getLanguage(resolvedLang)) {
            try {
              return hljs.highlight(code, { language: resolvedLang }).value;
            } catch(e) {}
          }
        }
        try {
          return hljs.highlightAuto(code).value;
        } catch(e) {
          return code;
        }
      }
    });

    const targetEl = document.getElementById(targetId);
    if (!targetEl) return;
    targetEl.innerHTML = marked.parse(cleanMarkdown);
    enhanceRenderedMarkdown(targetEl);
  }

  function renderSolutionView() {
    const barEl = document.getElementById('solutionsTabBar');
    const metaEl = document.getElementById('solutionsMeta');
    const contentEl = document.getElementById('solutionsContent');

    if (solutionsState.status === 'loading') {
      barEl.style.display = 'none';
      metaEl.style.display = 'none';
      contentEl.innerHTML = `
        <div style="color: var(--text-muted); padding: 36px 0; text-align: center;">
          <div style="display: inline-block; width: 18px; height: 18px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: sf-spin 0.8s linear infinite; vertical-align: middle; margin-right: 8px;"></div>
          <span>Loading solution from solutions folder...</span>
        </div>
      `;
      return;
    }

    if (solutionsState.status === 'error' || solutionsState.status === 'not_found' || !solutionsState.list || solutionsState.list.length === 0) {
      barEl.style.display = 'none';
      metaEl.style.display = 'none';
      const cleanSlug = solutionsState.slug || currentProblemSlug;
      contentEl.innerHTML = `
        <div style="padding: 24px 0; color: var(--text-muted);">
          <h3 style="color: var(--text); margin-top: 0; margin-bottom: 8px;">No Solution Markdown Found</h3>
          <p style="margin-bottom: 16px;">No pre-generated markdown file exists in the <code>solutions/</code> directory for this problem yet.</p>
          <div style="background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 8px; padding: 14px; margin-bottom: 16px;">
            <div style="font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); margin-bottom: 6px;">Generate with AI Solution Pipeline:</div>
            <code style="font-family: var(--font-mono); color: var(--accent); font-size: 12px; word-break: break-all;">python3 scripts/generate_ai_solutions.py --problem ${cleanSlug.replace(/-/g, '_')}</code>
          </div>
          <button class="case-pill active" style="padding: 6px 14px; cursor: pointer;" onclick="loadSolution('${cleanSlug}')">Reload Solution</button>
        </div>
      `;
      return;
    }

    if (solutionsState.list.length > 1) {
      barEl.style.display = 'flex';
      barEl.innerHTML = solutionsState.list.map((sol, idx) => {
        const isActive = idx === solutionsState.activeIndex;
        const badge = sol.isOfficial 
          ? `<span class="official-badge">Editorial</span>`
          : (sol.voteCount !== undefined ? `<span class="vote-badge">▲ ${sol.voteCount}</span>` : '');
        const titleClean = (sol.title || 'Solution').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        return `
          <div class="solution-pill ${isActive ? 'active' : ''}" onclick="selectSolution(${idx})">
            ${badge}
            <span>${titleClean.length > 30 ? titleClean.slice(0, 28) + '…' : titleClean}</span>
          </div>
        `;
      }).join('');
    } else {
      barEl.style.display = 'none';
    }

    const currentSol = solutionsState.list[solutionsState.activeIndex] || solutionsState.list[0];
    if (currentSol) {
      metaEl.style.display = 'flex';
      const authorText = currentSol.author ? `by <strong>${currentSol.author}</strong>` : '';
      const voteText = (currentSol.voteCount !== undefined && !currentSol.isOfficial) ? ` • ▲ ${currentSol.voteCount} upvotes` : '';
      metaEl.innerHTML = `
        <div class="solution-meta-title">${(currentSol.title || 'Solution').replace(/</g, '&lt;').replace(/>/g, '&gt;')}</div>
        <div class="solution-meta-author">${authorText}${voteText}</div>
      `;
      renderMarkdown('solutionsContent', currentSol.content || '');
    }
  }

  window.selectSolution = function(index) {
    solutionsState.activeIndex = index;
    if (leftView === 'solutions') {
      renderSolutionView();
    }
  };

  window.setSolutionResult = function(slug, result) {
    if (slug !== currentProblemSlug && slug.replace(/-/g, '_') !== currentProblemSlug.replace(/-/g, '_')) return;

    if (result.status === 'loaded') {
      let list = [];
      if (result.official && result.official.content) {
        list.push(result.official);
      }
      if (Array.isArray(result.community)) {
        list = list.concat(result.community);
      }

      solutionsState = {
        slug: slug,
        status: 'loaded',
        list: list,
        activeIndex: 0,
        error: null
      };
    } else {
      solutionsState = {
        slug: slug,
        status: 'not_found',
        list: [],
        activeIndex: 0,
        error: result.error || 'No solution file found'
      };
    }

    if (leftView === 'solutions') {
      renderSolutionView();
    }
  };

  function loadSolution(slug) {
    if (!slug) return;
    if (solutionsState.slug === slug && solutionsState.status === 'loaded' && solutionsState.list.length > 0) {
      renderSolutionView();
      return;
    }

    solutionsState = { slug: slug, status: 'loading', list: [], activeIndex: 0, error: null };
    renderSolutionView();

    if (workspaceBridge && workspaceBridge.onFetchSolutionRequested) {
      workspaceBridge.onFetchSolutionRequested(slug);
    }
  }

  // ─── C++ API EXPOSED ───
  window.setProblemData = function(data) {
    currentProblemSlug = (data.problem_id) || (data.manifest && data.manifest.entry && data.manifest.entry.title) || (data.id ? data.id.replace(/_/g, '-') : '');
    solutionsState = { slug: '', status: 'idle', list: [], activeIndex: 0, error: null };
    document.getElementById('solutionsTabBar').innerHTML = '';
    document.getElementById('solutionsTabBar').style.display = 'none';
    document.getElementById('solutionsMeta').innerHTML = '';
    document.getElementById('solutionsMeta').style.display = 'none';
    document.getElementById('solutionsContent').innerHTML = '';

    document.getElementById('probTitle').textContent = data.title || 'Untitled';
    let diff = (data.difficulty || 'easy').toLowerCase();
    let pDiff = document.getElementById('probDiff');
    pDiff.textContent = diff.toUpperCase();
    pDiff.className = `diff-pill diff-${diff}`;
    
    let tagsHtml = (data.tags || []).map(t => `<span class="tag-chip">${t}</span>`).join('');
    document.getElementById('probTags').innerHTML = tagsHtml;
    
    let descHtml = data.description || '';
    if (data.markdown) {
      renderMarkdown('probDesc', data.markdown);
    } else {
      document.getElementById('probDesc').innerHTML = descHtml;
    }

    if (leftView === 'solutions' && currentProblemSlug) {
      loadSolution(currentProblemSlug);
    }

    // Auto-load saved notes for this problem
    if (typeof loadProblemNotes === 'function') {
      loadProblemNotes(data.title);
    }
  };

  window.setTestCases = function(tcList) {
    tcList.forEach(tc => {
      if (tc.input) {
        // Clean up {"elemType": "int", "value": [...]} to just [...]
        tc.input = tc.input.replace(/\{"elemType"\s*:\s*"[^"]*"\s*,\s*"value"\s*:\s*(\[[^\]]*\])\}/g, "$1");
      }
    });
    testCases = tcList.map(tc => ({ ...tc, status: 'pending', actualOutput: '' }));
    currentCaseIndex = 0;
    currentSubCaseIndex = 0;
    renderInputTabs();
    renderInputContent();
  };

  window.setTestResult = function(res) {
    let tc = testCases[res.index];
    if (tc) {
      if (res.status) {
        if (res.status === 'Accepted') tc.status = 'passed';
        else tc.status = 'failed';
        tc.statusText = res.status;
      } else {
        tc.status = res.passed ? 'passed' : 'failed';
        tc.statusText = res.passed ? 'Accepted' : 'Wrong Answer';
      }
      tc.actualOutput = res.actualOutput;
      if (res.expected) tc.output = res.expected; // Update expected
      tc.elapsedMs = res.elapsedMs || 0;
    }
    
    // Switch to submissions tab if we aren't already there
    setLeftView('submissions');
    renderSubmissions();
  };

  window.setTestRunning = function(idx) {
    if (testCases[idx]) {
      testCases[idx].status = 'running';
    }
    setLeftView('submissions');
    renderSubmissions();
  };

  window.clearAllResults = function() {
    testCases.forEach(tc => { tc.status = 'pending'; tc.actualOutput = ''; });
    renderSubmissions();
  };

  window.setCode = function(code) {
    isInternalChange = true;
    editor.setValue(code || "");
    isInternalChange = false;
  };

  window.setLanguages = function(data) {
    let sel = document.getElementById('langSelect');
    sel.classList.remove('loading');
    sel.innerHTML = '';
    data.languages.forEach(l => {
      let opt = document.createElement('option');
      opt.value = l; opt.textContent = l.toUpperCase();
      sel.appendChild(opt);
    });
    sel.value = data.current;
    window.setLanguage(data.current);
  };

  window.setLanguage = function(langId) {
    let mode = 'text/x-c++src';
    let l = langId.toLowerCase();
    if(l==='python' || l==='py') mode = 'python';
    else if(l==='javascript' || l==='js') mode = 'javascript';
    else if(l==='rust' || l==='rs') mode = 'rust';
    else if(l==='go') mode = 'go';
    editor.setOption('mode', mode);
  };

  // ─── RENDERERS ───
  function renderInputTabs() {
    let html = '';
    // Bottom panel previews only the first 3 inputs; the rest live in Submissions
    let previewCount = Math.min(testCases.length, 3);
    for(let i = 0; i < previewCount; i++) {
      let active = i === currentCaseIndex ? 'active' : '';
      html += `<div class="case-pill ${active}" onclick="selectInputCase(${i})">Case ${i+1}</div>`;
    }
    document.getElementById('caseTabs').innerHTML = html;
    let countEl = document.getElementById('tcCount');
    countEl.textContent = testCases.length > 0 ? `${currentCaseIndex + 1} / ${testCases.length}` : '';
  }

  window.selectInputCase = function(i) {
    currentCaseIndex = i;
    renderInputTabs();
    renderInputContent();
  };

  function renderInputContent() {
    let tc = testCases[currentCaseIndex];
    if (!tc) { document.getElementById('caseContent').innerHTML = ''; return; }
    
    let html = `
      <div class="case-field">
        <div class="case-field-title">Input</div>
        <div class="case-field-val">${tc.input}</div>
      </div>
      <div class="case-field">
        <div class="case-field-title">Expected Output</div>
        <div class="case-field-val val-expected">${tc.output || tc.expectedOutput || ''}</div>
      </div>
    `;
    document.getElementById('caseContent').innerHTML = html;
  }

  // --- Submissions Renderers ---
  function renderSubmissions() {
    if(testCases.length === 0) return;
    
    // Compute summary
    let passedCount = 0, failedCount = 0, runningCount = 0, pendingCount = 0;
    let anyFailStatusText = '';
    let totalTime = 0;
    
    testCases.forEach(tc => {
      if(tc.status === 'passed') passedCount++;
      else if(tc.status === 'failed') { failedCount++; if(!anyFailStatusText) anyFailStatusText = tc.statusText || 'Wrong Answer'; }
      else if(tc.status === 'running') runningCount++;
      else pendingCount++;
      
      if(tc.elapsedMs) totalTime += tc.elapsedMs;
    });
    
    let overallStatus = 'Pending';
    let statusClass = '';
    
    if (runningCount > 0) {
      overallStatus = 'Running...';
      statusClass = 'running';
    } else if (failedCount > 0) {
      overallStatus = anyFailStatusText.toUpperCase();
      statusClass = 'failed';
    } else if (passedCount > 0 && pendingCount === 0) {
      overallStatus = 'Accepted';
      statusClass = 'passed';
    } else if (passedCount > 0) {
      overallStatus = 'Partially Accepted';
      statusClass = 'passed';
    }
    
    let summaryHtml = `
      <div class="submissions-summary">
        <div class="sub-status ${statusClass}">${overallStatus}</div>
        <div class="sub-metrics">
          <div>${passedCount} / ${testCases.length} testcases passed</div>
          ${totalTime > 0 ? `<div>Runtime: ${totalTime} ms</div>` : ''}
        </div>
      </div>
    `;
    document.getElementById('submissionSummary').innerHTML = summaryHtml;
    
    // Render Case Grid
    let tabsHtml = '';
    testCases.forEach((tc, i) => {
      let active = i === currentSubCaseIndex ? 'active' : '';
      let status = tc.status; // pending, running, passed, failed
      let dot = '';
      if(status==='passed') dot = '✓ ';
      if(status==='failed') dot = '✗ ';
      if(status==='running') dot = '◌ ';
      tabsHtml += `<div class="case-pill ${active} ${status}" onclick="selectSubCase(${i})">${dot}Case ${i+1}</div>`;
    });
    document.getElementById('subCaseTabs').innerHTML = tabsHtml;
    
    renderSubCaseContent();
  }

  window.selectSubCase = function(i) {
    currentSubCaseIndex = i;
    renderSubmissions();
  };

  function renderSubCaseContent() {
    let tc = testCases[currentSubCaseIndex];
    if (!tc || tc.status === 'pending') { 
      document.getElementById('subCaseContent').innerHTML = '<div style="color:var(--text-muted); padding:16px;">This test case has not been run yet.</div>';
      return; 
    }
    
    let actClass = tc.status === 'passed' ? 'val-actual-pass' : (tc.status === 'failed' ? 'val-actual-fail' : '');
    let runTimeStr = tc.elapsedMs !== undefined ? ` <span style="font-size: 11px; color: var(--text-muted); font-weight: normal; margin-left: 8px;">(${tc.elapsedMs} ms)</span>` : '';
    let statusDisplay = tc.statusText ? tc.statusText.toUpperCase() : tc.status.toUpperCase();
    
    let actualHtml = tc.status === 'running' ? 'Running...' : (tc.actualOutput || '—');
    try {
       if (actualHtml.startsWith('{') || actualHtml.startsWith('[')) {
           actualHtml = JSON.stringify(JSON.parse(actualHtml), null, 2);
       }
    } catch(e){}

    let expectedHtml = tc.output || tc.expectedOutput || '';
    try {
       if (expectedHtml.startsWith('{') || expectedHtml.startsWith('[')) {
           expectedHtml = JSON.stringify(JSON.parse(expectedHtml), null, 2);
       }
    } catch(e){}

    let html = `
      <div class="case-field">
        <div class="case-field-title" style="display: flex; align-items: center; color: ${tc.status==='passed'?'var(--lime)':(tc.status==='running'?'var(--saffron)':'var(--rose)')};">
          ${statusDisplay} ${runTimeStr}
        </div>
      </div>
      <div class="case-field">
        <div class="case-field-title">Input</div>
        <div class="case-field-val">${tc.input}</div>
      </div>
      <div style="display: flex; gap: 16px; margin-top: 12px;">
        <div class="case-field" style="flex: 1;">
          <div class="case-field-title">Expected Output</div>
          <div class="case-field-val val-expected">${expectedHtml}</div>
        </div>
        <div class="case-field" style="flex: 1;">
          <div class="case-field-title">Your Output</div>
          <div class="case-field-val ${actClass}">${actualHtml}</div>
        </div>
      </div>
    `;
    document.getElementById('subCaseContent').innerHTML = html;
  }

  // ─── WEBCHANNEL INIT ───
  function setupWebChannel(cb) {
    let connected = false;
    function tryConnect() {
      if (connected) return true;
      if (typeof qt !== "undefined" && qt.webChannelTransport) {
        connected = true;
        new QWebChannel(qt.webChannelTransport, function(ch) { cb(ch); });
        return true;
      }
      return false;
    }
    if (tryConnect()) return;
    document.addEventListener("DOMContentLoaded", tryConnect);
    window.addEventListener("load", tryConnect);
    let timer = setInterval(() => { if (tryConnect()) clearInterval(timer); }, 20);
  }

  setupWebChannel(function(channel) {
    workspaceBridge = channel.objects.workspaceBridge;
    if (workspaceBridge) {
      workspaceBridge.onWorkspaceReady();
      if (leftView === 'solutions' && currentProblemSlug && solutionsState.status === 'loading') {
        workspaceBridge.onFetchSolutionRequested(currentProblemSlug);
      }
    }
  });

</script>
</body>
</html>
