<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Unified SyntaxFlow Workspace</title>
  
  <!-- CodeMirror CSS -->
  <link rel="stylesheet" href="codemirror.min.css">
  <link rel="stylesheet" href="addons/show-hint.min.css">
  <link rel="stylesheet" href="addons/foldgutter.min.css">
  <link rel="stylesheet" href="themes/monokai.min.css">
  <link rel="stylesheet" href="themes/dracula.min.css">
  <link rel="stylesheet" href="themes/material-darker.min.css">
  <link rel="stylesheet" href="themes/nord.min.css">
  <link rel="stylesheet" href="themes/material.min.css">
  <link rel="stylesheet" href="themes/ayu-mirage.min.css">

  <!-- Highlight.js CSS for Markdown -->
  <link rel="stylesheet" href="highlight-tokyo-night.min.css">

  <style>
    :root {
      --bg: #121213;
      --surface: #1a1a1c;
      --surface-2: #222225;
      --border: #3f3f46;
      --border-subtle: #333338;
      --text: #e4e4e7;
      --text-muted: #9a9aa3;
      --accent: #5c9eff;
      --accent-dim: rgba(92, 158, 255, 0.12);
      --lime: #a3e635;
      --rose: #fb7185;
      --saffron: #f5a623;
    }

    :root[data-theme="light"] {
      --bg: #f6f7f9;
      --surface: #ffffff;
      --surface-2: #eceef1;
      --border: #d5d9df;
      --border-subtle: #e2e5e9;
      --text: #1c1f24;
      --text-muted: #5b6470;
      --accent: #2563eb;
      --accent-dim: rgba(37, 99, 235, 0.1);
      --lime: #16a34a;
      --rose: #dc2626;
      --saffron: #d97706;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background-color: var(--bg); color: var(--text);
      font-family: 'Segoe UI', 'Inter', -apple-system, sans-serif;
      overflow: hidden;
      font-size: 14px;
    }

    /* Layout structure */
    .app-container {
      display: flex; flex-direction: column; height: 100vh; width: 100vw;
    }
    
    .toolbar {
      height: 48px; background: var(--surface); display: flex; align-items: center;
      padding: 0 16px; border-bottom: 1px solid var(--border);
      gap: 12px;
    }

    .btn {
      background: transparent; border: 1px solid var(--border); color: var(--text);
      padding: 6px 12px; cursor: pointer; font-size: 13px;
      font-weight: 500; transition: all 0.15s ease;
      border-radius: 4px;
    }
    .btn:hover { background: var(--surface-2); }
    .btn-primary {
      background: rgba(92, 158, 255, 0.12); border-color: rgba(92, 158, 255, 0.35);
      color: var(--accent);
    }
    .btn-primary:hover { background: rgba(92, 158, 255, 0.2); }
    .btn-run {
      color: var(--accent);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 34px;
      padding: 6px 0;
    }
    .btn-run svg { width: 15px; height: 15px; }

    .toolbar-divider {
      width: 1px;
      height: 20px;
      background: var(--border);
      margin: 0 2px;
    }

    .btn-group {
      display: inline-flex;
      align-items: stretch;
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
      background: var(--surface);
    }
    .btn-group .btn {
      border: none;
      border-radius: 0;
    }
    .btn-group .icon-btn {
      border: none;
      border-radius: 0;
      background: transparent;
      width: 34px;
      height: auto;
    }
    .btn-group > :not(:first-child) {
      border-left: 1px solid var(--border);
    }

    /* ─── Toolbar dropdown (timer / stopwatch) ─── */
    .toolbar .dropdown { position: relative; display: inline-flex; }
    .toolbar .dropdown-menu {
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      left: auto;
      min-width: 150px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      z-index: 200;
      padding: 6px;
      display: none;
    }
    .toolbar .dropdown.open .dropdown-menu { display: block; }
    .toolbar .menu-section-title {
      font-size: 10px; font-weight: 600; letter-spacing: 0.5px;
      text-transform: uppercase; color: var(--text-muted);
      padding: 4px 10px;
    }
    .toolbar .menu-item {
      display: flex; align-items: center; gap: 8px;
      padding: 7px 10px; border-radius: 6px;
      font-size: 13px; color: var(--text-secondary);
      cursor: pointer; user-select: none; white-space: nowrap;
      transition: background 0.12s, color 0.12s;
    }
    .toolbar .menu-item:hover { background: var(--surface-2); color: var(--text); }
    .toolbar .menu-item.selected { color: var(--accent); font-weight: 500; background: var(--accent-dim); }
    .toolbar .menu-item.selected::after { content: '✓'; margin-left: auto; font-size: 12px; }

    .main-workspace {
      display: flex; flex: 1; overflow: hidden;
    }

    .pane { overflow: auto; position: relative; }
    .left-pane { width: 40%; background: var(--bg); display: flex; flex-direction: column; }
    
    .resizer-v {
      width: 6px; background: var(--border-subtle); cursor: col-resize; z-index: 10;
      transition: background 0.15s;
    }
    .resizer-v:hover, .resizer-v.active { background: var(--accent); }

    .right-pane { width: calc(60% - 6px); display: flex; flex-direction: column; background: var(--bg); }
    
    .top-pane { height: 65%; display: flex; flex-direction: column; }
    .bottom-pane { height: calc(35% - 6px); background: var(--bg); display: flex; flex-direction: column; }

    .resizer-h {
      height: 6px; background: var(--border-subtle); cursor: row-resize; z-index: 10;
      transition: background 0.15s;
    }
    .resizer-h:hover, .resizer-h.active { background: var(--accent); }

    /* ─── Panel Headers & Icon Buttons (LeetCode-style) ─── */
    .icon-btn {
      width: 30px; height: 30px;
      display: inline-flex; align-items: center; justify-content: center;
      background: transparent; border: none; color: var(--text-muted);
      cursor: pointer; border-radius: 4px; flex-shrink: 0;
      transition: background 0.15s, color 0.15s;
    }
    .icon-btn:hover { background: var(--surface-2); color: var(--text); }
    .icon-btn svg { width: 15px; height: 15px; }

    .editor-header {
      height: 40px; min-height: 40px;
      display: flex; align-items: center;
      padding: 0 8px 0 12px;
      background: var(--surface);
      border-bottom: 1px solid var(--border-subtle);
      gap: 2px;
    }
    .lang-select {
      appearance: none; outline: none; border: none; cursor: pointer;
      background: transparent; color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px; font-weight: 600;
      padding: 6px 8px; border-radius: 4px;
      transition: background 0.15s;
    }
    .lang-select:hover { background: var(--surface-2); }
    .lang-select option { background: var(--surface); color: var(--text); }

    .left-tabs { position: relative; }
    .left-tab-icon {
      position: absolute; right: 8px; top: 50%;
      transform: translateY(-50%);
      width: 28px; height: 28px;
    }

    /* ─── Maximized Panel States ─── */
    .main-workspace.m-desc .left-pane { width: 100% !important; }
    .main-workspace.m-desc .right-pane,
    .main-workspace.m-desc .resizer-v { display: none; }

    .main-workspace.m-editor .left-pane,
    .main-workspace.m-editor .resizer-v { display: none; }
    .main-workspace.m-editor .right-pane { width: 100% !important; }
    .main-workspace.m-editor .top-pane { height: 100% !important; }
    .main-workspace.m-editor .bottom-pane,
    .main-workspace.m-editor .resizer-h { display: none; }

    .main-workspace.m-tc .left-pane,
    .main-workspace.m-tc .resizer-v { display: none; }
    .main-workspace.m-tc .right-pane { width: 100% !important; }
    .main-workspace.m-tc .top-pane,
    .main-workspace.m-tc .resizer-h { display: none; }
    .main-workspace.m-tc .bottom-pane { height: 100% !important; flex: 1; }

    /* Problem Description Styling */
    .problem-content { padding: 24px; overflow-y: auto; flex: 1; }
    .problem-content h1 { font-size: 22px; color: var(--text); margin-top: 0; }
    .diff-pill {
      font-size: 11px; font-weight: 600; padding: 3px 10px;
      display: inline-flex; align-items: center; gap: 6px;
      text-transform: uppercase; letter-spacing: 0.2px;
      margin-right: 8px;
      border: 1px solid transparent;
      border-radius: 4px;
    }
    .diff-pill::before {
      content: ''; width: 6px; height: 6px; background: currentColor;
    }
    .diff-easy { color: var(--lime); background: rgba(163, 230, 53, 0.08); border-color: rgba(163, 230, 53, 0.35); }
    .diff-medium { color: var(--saffron); background: rgba(245, 166, 35, 0.08); border-color: rgba(245, 166, 35, 0.35); }
    .diff-hard { color: var(--rose); background: rgba(251, 113, 133, 0.08); border-color: rgba(251, 113, 133, 0.35); }
    .tag-chip {
      font-size: 11px; background: transparent; color: var(--text-muted);
      border: 1px solid var(--border); padding: 2px 8px; margin-right: 6px;
      border-radius: 4px;
    }
    
    .problem-content pre { background: var(--surface) !important; padding: 12px; border: 1px solid var(--border); overflow-x: auto; }
    .problem-content code { font-family: 'JetBrains Mono', monospace; font-size: 13px; }
    .problem-content p { line-height: 1.6; }

    html[data-theme="light"] .problem-content pre code.hljs,
    html[data-theme="light"] .problem-content pre code {
      background: #f6f7f9; color: #1c1f24;
    }
    html[data-theme="light"] .problem-content pre code.hljs .hljs-comment,
    html[data-theme="light"] .problem-content pre code.hljs .hljs-meta { color: #8b939e; }
    html[data-theme="light"] .problem-content pre code.hljs .hljs-keyword,
    html[data-theme="light"] .problem-content pre code.hljs .hljs-tag,
    html[data-theme="light"] .problem-content pre code.hljs .hljs-selector-class,
    html[data-theme="light"] .problem-content pre code.hljs .hljs-selector-id,
    html[data-theme="light"] .problem-content pre code.hljs .hljs-deletion { color: #c026d3; }
    html[data-theme="light"] .problem-content pre code.hljs .hljs-string,
    html[data-theme="light"] .problem-content pre code.hljs .hljs-symbol,
    html[data-theme="light"] .problem-content pre code.hljs .hljs-addition { color: #15803d; }
    html[data-theme="light"] .problem-content pre code.hljs .hljs-number,
    html[data-theme="light"] .problem-content pre code.hljs .hljs-literal,
    html[data-theme="light"] .problem-content pre code.hljs .hljs-type,
    html[data-theme="light"] .problem-content pre code.hljs .hljs-variable { color: #c2410c; }
    html[data-theme="light"] .problem-content pre code.hljs .hljs-title,
    html[data-theme="light"] .problem-content pre code.hljs .hljs-property,
    html[data-theme="light"] .problem-content pre code.hljs .hljs-section,
    html[data-theme="light"] .problem-content pre code.hljs .hljs-attr { color: #1d4ed8; }
    html[data-theme="light"] .problem-content pre code.hljs .hljs-built_in,
    html[data-theme="light"] .problem-content pre code.hljs .hljs-attribute { color: #c2410c; }
    html[data-theme="light"] .problem-content pre code.hljs .hljs-operator,
    html[data-theme="light"] .problem-content pre code.hljs .hljs-name,
    html[data-theme="light"] .problem-content pre code.hljs .hljs-quote { color: #1d4ed8; }
    html[data-theme="light"] .problem-content pre code.hljs .hljs-punctuation,
    html[data-theme="light"] .problem-content pre code.hljs .hljs-params { color: #5b6470; }

    /* Code Editor wrapper */
    .editor-wrapper { flex: 1; min-height: 0; position: relative; }
    .CodeMirror { height: 100% !important; font-family: 'JetBrains Mono', monospace; font-size: 14px; }

    /* ─── Custom SyntaxFlow editor theme (matches UI palette) ─── */
    .cm-s-syntaxflow.CodeMirror {
      background: #121213; color: #e4e4e7;
    }
    .cm-s-syntaxflow .CodeMirror-gutters {
      background: #161618; border-right: 1px solid #3f3f46;
    }
    .cm-s-syntaxflow .CodeMirror-linenumber { color: #55555e; }
    .cm-s-syntaxflow .CodeMirror-cursor { border-left: 2px solid #5c9eff; }
    .cm-s-syntaxflow .CodeMirror-selected { background: rgba(92, 158, 255, 0.18); }
    .cm-s-syntaxflow .CodeMirror-focused .CodeMirror-selected { background: rgba(92, 158, 255, 0.22); }
    .cm-s-syntaxflow .CodeMirror-activeline-background,
    .cm-s-syntaxflow .CodeMirror-activeLine { background: rgba(255, 255, 255, 0.04); }
    .cm-s-syntaxflow .CodeMirror-matchingbracket {
      color: #e4e4e7; background: rgba(92, 158, 255, 0.15);
      outline: 1px solid rgba(92, 158, 255, 0.4);
    }
    .cm-s-syntaxflow .CodeMirror-foldgutter-open,
    .cm-s-syntaxflow .CodeMirror-foldgutter-folded { color: #55555e; }

    .cm-s-syntaxflow .cm-keyword { color: #fb7185; }
    .cm-s-syntaxflow .cm-builtin { color: #f5a623; }
    .cm-s-syntaxflow .cm-type { color: #5c9eff; }
    .cm-s-syntaxflow .cm-def { color: #7dd3fc; }
    .cm-s-syntaxflow .cm-variable { color: #e4e4e7; }
    .cm-s-syntaxflow .cm-variable-2 { color: #a5b4fc; }
    .cm-s-syntaxflow .cm-variable-3 { color: #f5a623; }
    .cm-s-syntaxflow .cm-property { color: #7dd3fc; }
    .cm-s-syntaxflow .cm-operator { color: #cbd5e1; }
    .cm-s-syntaxflow .cm-punctuation { color: #9a9aa3; }
    .cm-s-syntaxflow .cm-bracket { color: #9a9aa3; }
    .cm-s-syntaxflow .cm-number { color: #f5a623; }
    .cm-s-syntaxflow .cm-string { color: #a3e635; }
    .cm-s-syntaxflow .cm-string-2 { color: #a3e635; }
    .cm-s-syntaxflow .cm-atom { color: #f5a623; }
    .cm-s-syntaxflow .cm-comment { color: #6b6b74; font-style: italic; }
    .cm-s-syntaxflow .cm-tag { color: #fb7185; }
    .cm-s-syntaxflow .cm-attribute { color: #f5a623; }
    .cm-s-syntaxflow .cm-qualifier { color: #5c9eff; }
    .cm-s-syntaxflow .cm-meta { color: #9a9aa3; }
    .cm-s-syntaxflow .cm-hr { color: #6b6b74; }
    .cm-s-syntaxflow .cm-link { color: #5c9eff; }
    .cm-s-syntaxflow .cm-error { color: #fb7185; text-decoration: underline; }

    .CodeMirror-hints {
      background: #1a1a1c; border: 1px solid #3f3f46; border-radius: 4px;
      box-shadow: none; font-family: 'JetBrains Mono', monospace; font-size: 13px;
    }
    .CodeMirror-hint { color: #9a9aa3; }
    .CodeMirror-hint-active { background: rgba(92, 158, 255, 0.15); color: #e4e4e7; }

    /* ─── Light theme overrides ─── */
    html[data-theme="light"] .cm-s-syntaxflow.CodeMirror {
      background: #ffffff; color: #1c1f24;
    }
    html[data-theme="light"] .cm-s-syntaxflow .CodeMirror-gutters {
      background: #f6f7f9; border-right: 1px solid #e2e5e9;
    }
    html[data-theme="light"] .cm-s-syntaxflow .CodeMirror-linenumber { color: #b0b6bf; }
    html[data-theme="light"] .cm-s-syntaxflow .CodeMirror-cursor { border-left: 2px solid #2563eb; }
    html[data-theme="light"] .cm-s-syntaxflow .CodeMirror-selected { background: rgba(37, 99, 235, 0.14); }
    html[data-theme="light"] .cm-s-syntaxflow .CodeMirror-focused .CodeMirror-selected { background: rgba(37, 99, 235, 0.18); }
    html[data-theme="light"] .cm-s-syntaxflow .CodeMirror-activeline-background,
    html[data-theme="light"] .cm-s-syntaxflow .CodeMirror-activeLine { background: rgba(0, 0, 0, 0.04); }
    html[data-theme="light"] .cm-s-syntaxflow .CodeMirror-matchingbracket {
      color: #1c1f24; background: rgba(37, 99, 235, 0.12);
      outline: 1px solid rgba(37, 99, 235, 0.35);
    }
    html[data-theme="light"] .cm-s-syntaxflow .CodeMirror-foldgutter-open,
    html[data-theme="light"] .cm-s-syntaxflow .CodeMirror-foldgutter-folded { color: #b0b6bf; }
    html[data-theme="light"] .cm-s-syntaxflow .cm-keyword { color: #c026d3; }
    html[data-theme="light"] .cm-s-syntaxflow .cm-builtin { color: #c2410c; }
    html[data-theme="light"] .cm-s-syntaxflow .cm-type { color: #1d4ed8; }
    html[data-theme="light"] .cm-s-syntaxflow .cm-def { color: #0e7490; }
    html[data-theme="light"] .cm-s-syntaxflow .cm-variable { color: #1c1f24; }
    html[data-theme="light"] .cm-s-syntaxflow .cm-variable-2 { color: #6d28d9; }
    html[data-theme="light"] .cm-s-syntaxflow .cm-variable-3 { color: #c2410c; }
    html[data-theme="light"] .cm-s-syntaxflow .cm-property { color: #0e7490; }
    html[data-theme="light"] .cm-s-syntaxflow .cm-operator { color: #374151; }
    html[data-theme="light"] .cm-s-syntaxflow .cm-punctuation { color: #6b7280; }
    html[data-theme="light"] .cm-s-syntaxflow .cm-bracket { color: #6b7280; }
    html[data-theme="light"] .cm-s-syntaxflow .cm-number { color: #c2410c; }
    html[data-theme="light"] .cm-s-syntaxflow .cm-string { color: #15803d; }
    html[data-theme="light"] .cm-s-syntaxflow .cm-string-2 { color: #15803d; }
    html[data-theme="light"] .cm-s-syntaxflow .cm-atom { color: #c2410c; }
    html[data-theme="light"] .cm-s-syntaxflow .cm-comment { color: #94a3b8; font-style: italic; }
    html[data-theme="light"] .cm-s-syntaxflow .cm-tag { color: #c026d3; }
    html[data-theme="light"] .cm-s-syntaxflow .cm-attribute { color: #c2410c; }
    html[data-theme="light"] .cm-s-syntaxflow .cm-qualifier { color: #1d4ed8; }
    html[data-theme="light"] .cm-s-syntaxflow .cm-meta { color: #6b7280; }
    html[data-theme="light"] .cm-s-syntaxflow .cm-hr { color: #94a3b8; }
    html[data-theme="light"] .cm-s-syntaxflow .cm-link { color: #1d4ed8; }
    html[data-theme="light"] .cm-s-syntaxflow .cm-error { color: #dc2626; text-decoration: underline; }
    html[data-theme="light"] .CodeMirror-hints {
      background: #ffffff; border: 1px solid #d5d9df; border-radius: 4px;
      box-shadow: none; font-family: 'JetBrains Mono', monospace; font-size: 13px;
    }
    html[data-theme="light"] .CodeMirror-hint { color: #5b6470; }
    html[data-theme="light"] .CodeMirror-hint-active { background: rgba(37, 99, 235, 0.12); color: #1c1f24; }

    .theme-toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
      color: var(--text); padding: 8px 18px; font-size: 13px; font-weight: 500;
      opacity: 0; pointer-events: none; transition: opacity 0.2s ease;
      z-index: 1000;
    }
    .theme-toast.show { opacity: 1; }

    /* ─── Theme Palette ─── */
    .theme-palette-overlay {
      position: fixed; inset: 0; z-index: 1000;
      background: rgba(0, 0, 0, 0.5);
      display: flex; align-items: flex-start; justify-content: center;
      padding-top: 12vh;
      opacity: 0; pointer-events: none; transition: opacity 0.15s ease;
    }
    .theme-palette-overlay.show { opacity: 1; pointer-events: auto; }

    .theme-palette {
      width: 420px; max-width: 92vw;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; box-shadow: 0 16px 48px rgba(0, 0, 0, 0.5);
    }
    .theme-palette-header {
      padding: 12px 16px; font-size: 13px; font-weight: 600;
      color: var(--text); border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
    }
    .theme-palette-grid {
      padding: 8px; display: flex; flex-direction: column; gap: 2px;
      max-height: 46vh; overflow-y: auto;
    }
    .theme-palette-item {
      display: flex; align-items: center; gap: 12px;
      padding: 8px 10px; cursor: pointer; user-select: none;
      background: transparent; color: var(--text-secondary);
      border: 1px solid transparent;
      border-radius: 4px;
      transition: background 0.1s, color 0.1s;
    }
    .theme-palette-item:hover { background: var(--bg-hover); color: var(--text); }
    .theme-palette-item.highlighted {
      background: rgba(92, 158, 255, 0.12); color: var(--text);
      border-color: rgba(92, 158, 255, 0.3);
    }
    .theme-palette-item.active .theme-palette-name { color: var(--accent); font-weight: 600; }
    .theme-palette-swatch {
      display: flex; width: 64px; height: 22px; flex-shrink: 0;
      border: 1px solid var(--border); border-radius: 3px; overflow: hidden;
    }
    .theme-palette-swatch i { display: block; flex: 1; height: 100%; }
    .theme-palette-name { flex: 1; font-size: 13px; font-weight: 500; }
    .theme-palette-check { width: 16px; color: var(--accent); display: none; }
    .theme-palette-item.active .theme-palette-check { display: block; }
    .theme-palette-footer {
      padding: 8px 16px; border-top: 1px solid var(--border);
      font-size: 11px; color: var(--text-muted);
      display: flex; align-items: center; gap: 14px;
    }
    .theme-palette-footer kbd {
      font-family: var(--font-mono); font-size: 10px;
      background: var(--bg-hover); border: 1px solid var(--border);
      padding: 1px 5px; color: var(--text-secondary);
    }

    /* Test Case Panel */
    .testcase-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 16px; background: var(--surface); border-bottom: 1px solid var(--border);
    }
    .tc-tab {
      font-size: 11px; font-weight: 600;
      color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px;
    }
    .tc-count {
      font-size: 11px; font-family: 'JetBrains Mono', monospace; color: var(--border);
    }

    .testcase-body { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .case-list-bar {
      display: flex; align-items: center; gap: 2px;
      padding: 10px 16px 0; overflow-x: auto;
    }
    .case-pill {
      padding: 4px 12px; cursor: pointer;
      font-size: 12px; font-weight: 500; color: var(--text-muted);
      border: none; background: transparent;
      border-radius: 4px;
      transition: background 0.15s, color 0.15s;
      white-space: nowrap;
    }
    .case-pill:hover { background: var(--surface-2); color: var(--text); }
    .case-pill.active { background: var(--surface); color: var(--text); box-shadow: inset 0 0 0 1px var(--border); }
    .case-pill.passed { color: var(--lime); }
    .case-pill.failed { color: var(--rose); }
    .case-pill.running { color: var(--saffron); }

    /* Submissions grid: contained chips for dense selection list */
    .sub-case-grid .case-pill { background: var(--surface-2); border: 1px solid var(--border-subtle); }
    .sub-case-grid .case-pill:hover { background: var(--bg); border-color: var(--border); }
    .sub-case-grid .case-pill.active { box-shadow: inset 0 0 0 1px rgba(92, 158, 255, 0.5); }

    /* Left Pane Tabs */
    .left-tabs {
      display: flex; background: var(--surface); border-bottom: 1px solid var(--border-subtle);
    }
    .left-tab {
      padding: 12px 20px; cursor: pointer; font-size: 14px; font-weight: 500;
      color: var(--text-muted); border-bottom: 2px solid transparent; transition: all 0.2s;
    }
    .left-tab.active { color: var(--text); border-bottom-color: var(--accent); }
    .left-tab:hover:not(.active) { color: var(--text); }

    .submissions-summary {
      padding: 16px; border-bottom: 1px solid var(--border-subtle); background: var(--surface);
      border-radius: 4px; margin-bottom: 16px; display: flex; align-items: center; gap: 16px;
    }
    .sub-status { font-size: 20px; font-weight: bold; }
    .sub-status.passed { color: var(--lime); }
    .sub-status.failed { color: var(--rose); }
    .sub-status.running { color: var(--saffron); }
    .sub-metrics { font-size: 13px; color: var(--text-muted); }
    
    .sub-case-grid {
      display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px;
    }

    .case-content { padding: 12px 16px 16px; overflow-y: auto; flex: 1; }
    .case-field { margin-bottom: 12px; }
    .case-field-title {
      font-size: 10px; color: var(--text-muted); font-weight: 600;
      margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px;
    }
    .case-field-val {
      background: var(--surface); padding: 10px 12px; border-radius: 8px;
      border: 1px solid var(--border-subtle);
      font-family: 'JetBrains Mono', monospace; font-size: 13px;
      white-space: pre-wrap; line-height: 1.5;
    }
    .val-expected { border-left: 3px solid var(--lime); }
    .val-actual-pass { border-left: 3px solid var(--lime); }
    .val-actual-fail { border-left: 3px solid var(--rose); }

    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border-subtle); border-radius: 2px; border: 2px solid var(--bg); }
    ::-webkit-scrollbar-thumb:hover { background: var(--border); }
  </style>

  <script src="codemirror.min.js"></script>
  <script src="addons/matchbrackets.min.js"></script>
  <script src="addons/closebrackets.min.js"></script>
  <script src="addons/active-line.min.js"></script>
  <script src="addons/show-hint.min.js"></script>
  <script src="addons/foldcode.min.js"></script>
  <script src="addons/foldgutter.min.js"></script>
  <script src="addons/brace-fold.min.js"></script>
  <script src="addons/comment.min.js"></script>
  <script src="addons/simple-mode.min.js"></script>
  <script src="modes/clike.min.js"></script>
  <script src="modes/python.min.js"></script>
  <script src="modes/javascript.min.js"></script>
  <script src="modes/rust.min.js"></script>
  <script src="modes/go.min.js"></script>
  <script src="modes/xml.min.js"></script>
  <script src="modes/css.min.js"></script>
  
  <script src="marked.min.js"></script>
  <script src="highlight.min.js"></script>
  <script src="theme.js"></script>
  <script src="qwebchannel.js"></script>
</head>
<body>

<div class="app-container">
  <div class="toolbar">
    <button class="btn" id="btnBack">← Back</button>

    <div style="flex: 1;"></div>

    <div class="btn-group">
      <button class="icon-btn" id="btnNotes" title="Notes">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M16 13H8"/><path d="M16 17H8"/><path d="M10 9H8"/></svg>
      </button>
      <button class="btn btn-run" id="btnRun" title="Run current test (Ctrl+Enter)"></button>
      <button class="btn btn-primary" id="btnSubmit">Submit</button>
    </div>

    <div style="flex: 1;"></div>

    <div class="toolbar-divider"></div>

    <div class="dropdown" id="timerDropdown">
      <button class="icon-btn" id="btnTimer" title="Timer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="10" x2="14" y1="2" y2="2"/><line x1="12" x2="15" y1="14" y2="11"/><circle cx="12" cy="14" r="8"/></svg>
      </button>
      <div class="dropdown-menu">
        <div class="menu-section-title">Time</div>
        <div class="menu-item selected" data-timer-mode="timer">Timer</div>
        <div class="menu-item" data-timer-mode="stopwatch">Stopwatch</div>
      </div>
    </div>

    <button class="icon-btn" id="btnSettings" title="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
    </button>
  </div>

  <div class="theme-toast" id="themeToast"></div>

  <div class="theme-palette-overlay" id="themePaletteOverlay">
    <div class="theme-palette">
      <div class="theme-palette-header">
        <span>Color Theme</span>
        <span class="theme-palette-check-label" style="color: var(--text-muted); font-weight: 400; font-size: 12px;">Ctrl+K Ctrl+T</span>
      </div>
      <div class="theme-palette-grid" id="themePaletteGrid"></div>
      <div class="theme-palette-footer">
        <span><kbd>↑</kbd><kbd>↓</kbd> navigate</span>
        <span><kbd>↵</kbd> select</span>
        <span><kbd>Esc</kbd> close</span>
      </div>
    </div>
  </div>

  <div class="main-workspace">
    <div class="pane left-pane" id="leftPane">
      <div class="left-tabs">
        <div class="left-tab active" id="tabDesc">Description</div>
        <div class="left-tab" id="tabSubmissions">Submissions</div>
        <button class="icon-btn left-tab-icon" id="btnMaxDesc" title="Maximize description"></button>
      </div>
      <div class="problem-content" id="descPanel">
        <h1 id="probTitle">Loading...</h1>
        <div style="margin-bottom: 20px; display: flex; align-items: center; flex-wrap: wrap;">
          <span id="probDiff" class="diff-pill diff-easy">EASY</span>
          <div id="probTags"></div>
        </div>
        <div id="probDesc"></div>
      </div>
      <div class="problem-content" id="submissionsPanel" style="display: none;">
        <div id="submissionSummary">
          <div style="color:var(--text-muted); margin-top:20px;">Run your code to see submissions here.</div>
        </div>
        <div class="sub-case-grid" id="subCaseTabs"></div>
        <div class="case-content" id="subCaseContent" style="padding:0;"></div>
      </div>
    </div>
    
    <div class="resizer-v" id="resizerV"></div>
    
    <div class="pane right-pane" id="rightPane">
      <div class="pane top-pane" id="topPane">
        <div class="editor-header">
          <select class="lang-select" id="langSelect" title="Editor language"></select>
          <div style="flex: 1;"></div>
          <button class="icon-btn" id="btnReset" title="Reset code to original template"></button>
          <button class="icon-btn" id="btnMaxEditor" title="Maximize editor"></button>
        </div>
        <div class="editor-wrapper" id="editorContainer"></div>
      </div>
      
      <div class="resizer-h" id="resizerH"></div>
      
      <div class="pane bottom-pane" id="bottomPane">
        <div class="testcase-header">
          <span class="tc-tab">Testcases</span>
          <span class="tc-count" id="tcCount"></span>
          <div style="flex: 1;"></div>
          <button class="icon-btn" id="btnMaxTC" title="Maximize testcases"></button>
        </div>
        <div class="testcase-body">
          <div class="case-list-bar" id="caseTabs"></div>
          <div class="case-content" id="caseContent">
            <!-- Rendered by JS -->
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  // ─── STATE ───
  let workspaceBridge = null;
  let editor = null;
  let isInternalChange = false;
  let testCases = [];
  let currentCaseIndex = 0;
  let currentSubCaseIndex = 0;
  let leftView = 'desc'; // 'desc' or 'submissions'

  // ─── RESIZER LOGIC ───
  const resizerV = document.getElementById('resizerV');
  const leftPane = document.getElementById('leftPane');
  const rightPane = document.getElementById('rightPane');
  
  let isResizingV = false;
  resizerV.addEventListener('mousedown', (e) => { isResizingV = true; resizerV.classList.add('active'); });
  
  const resizerH = document.getElementById('resizerH');
  const topPane = document.getElementById('topPane');
  const bottomPane = document.getElementById('bottomPane');
  let isResizingH = false;
  resizerH.addEventListener('mousedown', (e) => { isResizingH = true; resizerH.classList.add('active'); });

  document.addEventListener('mousemove', (e) => {
    if (isResizingV) {
      let totalW = document.body.clientWidth;
      let newLW = (e.clientX / totalW) * 100;
      if (newLW > 10 && newLW < 90) {
        leftPane.style.width = newLW + '%';
        rightPane.style.width = `calc(${100 - newLW}% - 6px)`;
      }
    }
    if (isResizingH) {
      let topOffset = topPane.getBoundingClientRect().top;
      let totalH = rightPane.clientHeight;
      let newTH = ((e.clientY - topOffset) / totalH) * 100;
      if (newTH > 10 && newTH < 90) {
        topPane.style.height = newTH + '%';
        bottomPane.style.height = `calc(${100 - newTH}% - 6px)`;
      }
    }
  });

  document.addEventListener('mouseup', () => {
    isResizingV = false; isResizingH = false;
    resizerV.classList.remove('active'); resizerH.classList.remove('active');
  });

  // ─── CODEMIRROR INIT ───
  editor = CodeMirror(document.getElementById('editorContainer'), {
    value: "", mode: "text/x-c++src", theme: "syntaxflow",
    lineNumbers: true, tabSize: 4, indentUnit: 4, lineWrapping: false,
    autoCloseBrackets: true, matchBrackets: true, styleActiveLine: true,
    foldGutter: true, gutters: ["CodeMirror-linenumbers", "CodeMirror-foldgutter"],
    extraKeys: { "Ctrl-Space": "autocomplete" }
  });

  editor.on('change', function(cm) {
    if (isInternalChange) return;
    if (workspaceBridge) workspaceBridge.onTextChanged(cm.getValue());
  });
  editor.on('cursorActivity', function(cm) {
    let pos = cm.getCursor();
    if (workspaceBridge) workspaceBridge.onCursorPositionChanged(pos.line + 1, pos.ch + 1);
  });

  // ─── UI EVENTS ───
  document.getElementById('btnBack').onclick = () => { if(workspaceBridge) workspaceBridge.onBackRequested(); };
  document.getElementById('btnRun').onclick = () => { if(workspaceBridge) workspaceBridge.onRunRequested(currentCaseIndex); };
  document.getElementById('btnSubmit').onclick = () => { if(workspaceBridge) workspaceBridge.onSubmitRequested(); };
  document.getElementById('btnReset').onclick = () => { if(workspaceBridge) workspaceBridge.onResetRequested(); };

  // ─── TOOLBAR ICON ACTIONS ───
  const timerDropdown = document.getElementById('timerDropdown');
  const TIMER_SVG = '<line x1="10" x2="14" y1="2" y2="2"/><line x1="12" x2="15" y1="14" y2="11"/><circle cx="12" cy="14" r="8"/>';
  const STOPWATCH_SVG = '<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>';

  document.getElementById('btnTimer').onclick = (e) => {
    e.stopPropagation();
    timerDropdown.classList.toggle('open');
  };

  timerDropdown.querySelectorAll('.menu-item').forEach(item => {
    item.onclick = (e) => {
      e.stopPropagation();
      timerDropdown.querySelectorAll('.menu-item').forEach(i => i.classList.remove('selected'));
      item.classList.add('selected');
      const isStopwatch = item.dataset.timerMode === 'stopwatch';
      const btn = document.getElementById('btnTimer');
      btn.title = isStopwatch ? 'Stopwatch' : 'Timer';
      btn.querySelector('svg').innerHTML = isStopwatch ? STOPWATCH_SVG : TIMER_SVG;
      timerDropdown.classList.remove('open');
    };
  });

  document.addEventListener('click', () => timerDropdown.classList.remove('open'));

  document.getElementById('btnNotes').onclick = () => {
    // Notes panel (coming soon)
  };

  document.getElementById('btnSettings').onclick = () => {
    // Settings (coming soon)
  };
  
  document.getElementById('langSelect').onchange = (e) => {
    let lang = e.target.value;
    window.setLanguage(lang);
    if(workspaceBridge) workspaceBridge.onLanguageChanged(lang);
  };

  // ─── PANEL MAXIMIZE (LeetCode-style full view) ───
  const SVG_MAXIMIZE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>';
  const SVG_MINIMIZE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3v3a2 2 0 0 1-2 2H3"/><path d="M21 8h-3a2 2 0 0 1-2-2V3"/><path d="M3 16h3a2 2 0 0 1 2 2v3"/><path d="M16 21v-3a2 2 0 0 1 2-2h3"/></svg>';
  const SVG_RESET = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>';
  const SVG_PLAY = '<svg viewBox="0 0 24 24" fill="currentColor" stroke="none" width="15" height="15"><polygon points="6 3 20 12 6 21 6 3"/></svg>';

  document.getElementById('btnReset').innerHTML = SVG_RESET;
  document.getElementById('btnRun').innerHTML = SVG_PLAY;

  const panelNames = { desc: 'description', editor: 'editor', tc: 'testcases' };
  const maxButtons = {
    desc: document.getElementById('btnMaxDesc'),
    editor: document.getElementById('btnMaxEditor'),
    tc: document.getElementById('btnMaxTC')
  };
  let maximizedPanel = null;

  function setMaximized(panel) {
    const ws = document.querySelector('.main-workspace');
    ws.classList.remove('m-desc', 'm-editor', 'm-tc');
    maximizedPanel = (maximizedPanel === panel) ? null : panel;
    if (maximizedPanel) ws.classList.add('m-' + maximizedPanel);
    for (const key in maxButtons) {
      const isActive = maximizedPanel === key;
      maxButtons[key].innerHTML = isActive ? SVG_MINIMIZE : SVG_MAXIMIZE;
      maxButtons[key].title = (isActive ? 'Restore ' : 'Maximize ') + panelNames[key];
    }
  }

  document.getElementById('btnMaxDesc').innerHTML = SVG_MAXIMIZE;
  document.getElementById('btnMaxEditor').innerHTML = SVG_MAXIMIZE;
  document.getElementById('btnMaxTC').innerHTML = SVG_MAXIMIZE;
  document.getElementById('btnMaxDesc').onclick = () => setMaximized('desc');
  document.getElementById('btnMaxEditor').onclick = () => setMaximized('editor');
  document.getElementById('btnMaxTC').onclick = () => setMaximized('tc');

  // ─── THEME SWITCHER ───
  const editorThemes = [
    { id: 'syntaxflow', label: 'SyntaxFlow', swatch: ['#121213', '#5c9eff', '#a3e635', '#fb7185', '#f5a623'] },
    { id: 'ayu-mirage', label: 'Ayu Mirage', swatch: ['#1f2430', '#39bae6', '#aad94c', '#ffd173', '#ffb454'] },
    { id: 'monokai', label: 'Monokai', swatch: ['#272822', '#a6e22e', '#f92672', '#66d9ef', '#fd971f'] },
    { id: 'dracula', label: 'Dracula', swatch: ['#282a36', '#ff79c6', '#50fa7b', '#bd93f9', '#8be9fd'] },
    { id: 'material', label: 'Material', swatch: ['#263238', '#80cbc4', '#ff5370', '#82aaff', '#f78c6c'] },
    { id: 'material-darker', label: 'Material Darker', swatch: ['#212121', '#80cbc4', '#ff5370', '#82aaff', '#f78c6c'] },
    { id: 'nord', label: 'Nord', swatch: ['#2e3440', '#88c0d0', '#a3be8c', '#81a1c1', '#ebcb8b'] }
  ];
  let currentThemeIndex = 0;
  let themeToastTimer = null;
  const paletteOverlay = document.getElementById('themePaletteOverlay');
  const paletteGrid = document.getElementById('themePaletteGrid');
  let paletteIndex = 0;
  let paletteOpen = false;

  function showThemeToast(label) {
    const toast = document.getElementById('themeToast');
    toast.textContent = `Theme: ${label}`;
    toast.classList.add('show');
    clearTimeout(themeToastTimer);
    themeToastTimer = setTimeout(() => toast.classList.remove('show'), 1400);
  }

  function applyEditorTheme(id) {
    editor.setOption('theme', id);
    currentThemeIndex = editorThemes.findIndex(t => t.id === id);
    const label = editorThemes.find(t => t.id === id).label;
    showThemeToast(label);
    refreshPalette();
  }

  // ─── THEME PALETTE ───
  function refreshPalette() {
    const items = paletteGrid.querySelectorAll('.theme-palette-item');
    items.forEach((item, i) => {
      item.classList.toggle('active', i === currentThemeIndex);
      item.classList.toggle('highlighted', i === paletteIndex);
    });
  }

  function buildPalette() {
    paletteGrid.innerHTML = '';
    editorThemes.forEach((t, i) => {
      const item = document.createElement('div');
      item.className = 'theme-palette-item' + (i === currentThemeIndex ? ' active' : '');
      item.innerHTML = `
        <div class="theme-palette-swatch">${t.swatch.map(c => `<i style="background:${c}"></i>`).join('')}</div>
        <span class="theme-palette-name">${t.label}</span>
        <span class="theme-palette-check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><polyline points="20 6 9 17 4 12"/></svg></span>
      `;
      item.onclick = () => { applyEditorTheme(t.id); closePalette(); };
      item.onmouseenter = () => { paletteIndex = i; refreshPalette(); };
      paletteGrid.appendChild(item);
    });
  }

  function openPalette() {
    paletteIndex = currentThemeIndex;
    paletteOpen = true;
    buildPalette();
    refreshPalette();
    paletteOverlay.classList.add('show');
  }

  function closePalette() {
    paletteOpen = false;
    paletteOverlay.classList.remove('show');
  }

  paletteOverlay.addEventListener('mousedown', (e) => {
    if (e.target === paletteOverlay) closePalette();
  });

  document.addEventListener('keydown', (e) => {
    if (!paletteOpen) return;
    const count = editorThemes.length;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      paletteIndex = (paletteIndex + (e.key === 'ArrowDown' ? 1 : -1) + count) % count;
      refreshPalette();
      const item = paletteGrid.children[paletteIndex];
      if (item) item.scrollIntoView({ block: 'nearest' });
    } else if (e.key === 'Enter') {
      e.preventDefault();
      applyEditorTheme(editorThemes[paletteIndex].id);
      closePalette();
    } else if (e.key === 'Escape') {
      e.preventDefault();
      closePalette();
    }
  });

  // Ctrl+K then Ctrl+T chord (VSCode-style) to open the theme palette
  let ctrlKPending = false;
  document.addEventListener('keydown', (e) => {
    if (e.ctrlKey && !e.shiftKey && !e.altKey && e.key.toLowerCase() === 'k') {
      e.preventDefault();
      ctrlKPending = true;
      return;
    }
    if (ctrlKPending) {
      ctrlKPending = false;
      if (e.key.toLowerCase() === 't') {
        e.preventDefault();
        openPalette();
      }
    }
  });

  document.getElementById('tabDesc').onclick = () => { setLeftView('desc'); };
  document.getElementById('tabSubmissions').onclick = () => { setLeftView('submissions'); };

  function setLeftView(view) {
    leftView = view;
    document.getElementById('tabDesc').className = `left-tab ${view==='desc'?'active':''}`;
    document.getElementById('tabSubmissions').className = `left-tab ${view==='submissions'?'active':''}`;
    document.getElementById('descPanel').style.display = view==='desc' ? 'block' : 'none';
    document.getElementById('submissionsPanel').style.display = view==='submissions' ? 'block' : 'none';
    if(view === 'submissions') renderSubmissions();
  }

  // ─── C++ API EXPOSED ───
  window.setProblemData = function(data) {
    document.getElementById('probTitle').textContent = data.title || 'Untitled';
    let diff = (data.difficulty || 'easy').toLowerCase();
    let pDiff = document.getElementById('probDiff');
    pDiff.textContent = diff.toUpperCase();
    pDiff.className = `diff-pill diff-${diff}`;
    
    let tagsHtml = (data.tags || []).map(t => `<span class="tag-chip">${t}</span>`).join('');
    document.getElementById('probTags').innerHTML = tagsHtml;
    
    let descHtml = data.description || '';
    if (data.markdown) {
      marked.setOptions({
        highlight: function(code, lang) {
          if (lang && hljs.getLanguage(lang)) return hljs.highlight(code, { language: lang }).value;
          return hljs.highlightAuto(code).value;
        }
      });
      descHtml = marked.parse(data.markdown);
    }
    document.getElementById('probDesc').innerHTML = descHtml;
  };

  window.setTestCases = function(tcList) {
    tcList.forEach(tc => {
      if (tc.input) {
        // Clean up {"elemType": "int", "value": [...]} to just [...]
        tc.input = tc.input.replace(/\{"elemType"\s*:\s*"[^"]*"\s*,\s*"value"\s*:\s*(\[[^\]]*\])\}/g, "$1");
      }
    });
    testCases = tcList.map(tc => ({ ...tc, status: 'pending', actualOutput: '' }));
    currentCaseIndex = 0;
    currentSubCaseIndex = 0;
    renderInputTabs();
    renderInputContent();
  };

  window.setTestResult = function(res) {
    let tc = testCases[res.index];
    if (tc) {
      if (res.status) {
        if (res.status === 'Accepted') tc.status = 'passed';
        else tc.status = 'failed';
        tc.statusText = res.status;
      } else {
        tc.status = res.passed ? 'passed' : 'failed';
        tc.statusText = res.passed ? 'Accepted' : 'Wrong Answer';
      }
      tc.actualOutput = res.actualOutput;
      if (res.expected) tc.output = res.expected; // Update expected
      tc.elapsedMs = res.elapsedMs || 0;
    }
    
    // Switch to submissions tab if we aren't already there
    setLeftView('submissions');
    renderSubmissions();
  };

  window.setTestRunning = function(idx) {
    if (testCases[idx]) {
      testCases[idx].status = 'running';
    }
    setLeftView('submissions');
    renderSubmissions();
  };

  window.clearAllResults = function() {
    testCases.forEach(tc => { tc.status = 'pending'; tc.actualOutput = ''; });
    renderSubmissions();
  };

  window.setCode = function(code) {
    isInternalChange = true;
    editor.setValue(code || "");
    isInternalChange = false;
  };

  window.setLanguages = function(data) {
    let sel = document.getElementById('langSelect');
    sel.innerHTML = '';
    data.languages.forEach(l => {
      let opt = document.createElement('option');
      opt.value = l; opt.textContent = l.toUpperCase();
      sel.appendChild(opt);
    });
    sel.value = data.current;
    window.setLanguage(data.current);
  };

  window.setLanguage = function(langId) {
    let mode = 'text/x-c++src';
    let l = langId.toLowerCase();
    if(l==='python' || l==='py') mode = 'python';
    else if(l==='javascript' || l==='js') mode = 'javascript';
    else if(l==='rust' || l==='rs') mode = 'rust';
    else if(l==='go') mode = 'go';
    editor.setOption('mode', mode);
  };

  // ─── RENDERERS ───
  function renderInputTabs() {
    let html = '';
    // Bottom panel previews only the first 3 inputs; the rest live in Submissions
    let previewCount = Math.min(testCases.length, 3);
    for(let i = 0; i < previewCount; i++) {
      let active = i === currentCaseIndex ? 'active' : '';
      html += `<div class="case-pill ${active}" onclick="selectInputCase(${i})">Case ${i+1}</div>`;
    }
    document.getElementById('caseTabs').innerHTML = html;
    let countEl = document.getElementById('tcCount');
    countEl.textContent = testCases.length > 0 ? `${currentCaseIndex + 1} / ${testCases.length}` : '';
  }

  window.selectInputCase = function(i) {
    currentCaseIndex = i;
    renderInputTabs();
    renderInputContent();
  };

  function renderInputContent() {
    let tc = testCases[currentCaseIndex];
    if (!tc) { document.getElementById('caseContent').innerHTML = ''; return; }
    
    let html = `
      <div class="case-field">
        <div class="case-field-title">Input</div>
        <div class="case-field-val">${tc.input}</div>
      </div>
      <div class="case-field">
        <div class="case-field-title">Expected Output</div>
        <div class="case-field-val val-expected">${tc.output || tc.expectedOutput || ''}</div>
      </div>
    `;
    document.getElementById('caseContent').innerHTML = html;
  }

  // --- Submissions Renderers ---
  function renderSubmissions() {
    if(testCases.length === 0) return;
    
    // Compute summary
    let passedCount = 0, failedCount = 0, runningCount = 0, pendingCount = 0;
    let anyFailStatusText = '';
    let totalTime = 0;
    
    testCases.forEach(tc => {
      if(tc.status === 'passed') passedCount++;
      else if(tc.status === 'failed') { failedCount++; if(!anyFailStatusText) anyFailStatusText = tc.statusText || 'Wrong Answer'; }
      else if(tc.status === 'running') runningCount++;
      else pendingCount++;
      
      if(tc.elapsedMs) totalTime += tc.elapsedMs;
    });
    
    let overallStatus = 'Pending';
    let statusClass = '';
    
    if (runningCount > 0) {
      overallStatus = 'Running...';
      statusClass = 'running';
    } else if (failedCount > 0) {
      overallStatus = anyFailStatusText.toUpperCase();
      statusClass = 'failed';
    } else if (passedCount > 0 && pendingCount === 0) {
      overallStatus = 'Accepted';
      statusClass = 'passed';
    } else if (passedCount > 0) {
      overallStatus = 'Partially Accepted';
      statusClass = 'passed';
    }
    
    let summaryHtml = `
      <div class="submissions-summary">
        <div class="sub-status ${statusClass}">${overallStatus}</div>
        <div class="sub-metrics">
          <div>${passedCount} / ${testCases.length} testcases passed</div>
          ${totalTime > 0 ? `<div>Runtime: ${totalTime} ms</div>` : ''}
        </div>
      </div>
    `;
    document.getElementById('submissionSummary').innerHTML = summaryHtml;
    
    // Render Case Grid
    let tabsHtml = '';
    testCases.forEach((tc, i) => {
      let active = i === currentSubCaseIndex ? 'active' : '';
      let status = tc.status; // pending, running, passed, failed
      let dot = '';
      if(status==='passed') dot = '✓ ';
      if(status==='failed') dot = '✗ ';
      if(status==='running') dot = '◌ ';
      tabsHtml += `<div class="case-pill ${active} ${status}" onclick="selectSubCase(${i})">${dot}Case ${i+1}</div>`;
    });
    document.getElementById('subCaseTabs').innerHTML = tabsHtml;
    
    renderSubCaseContent();
  }

  window.selectSubCase = function(i) {
    currentSubCaseIndex = i;
    renderSubmissions();
  };

  function renderSubCaseContent() {
    let tc = testCases[currentSubCaseIndex];
    if (!tc || tc.status === 'pending') { 
      document.getElementById('subCaseContent').innerHTML = '<div style="color:var(--text-muted); padding:16px;">This test case has not been run yet.</div>';
      return; 
    }
    
    let actClass = tc.status === 'passed' ? 'val-actual-pass' : (tc.status === 'failed' ? 'val-actual-fail' : '');
    let runTimeStr = tc.elapsedMs !== undefined ? ` <span style="font-size: 11px; color: var(--text-muted); font-weight: normal; margin-left: 8px;">(${tc.elapsedMs} ms)</span>` : '';
    let statusDisplay = tc.statusText ? tc.statusText.toUpperCase() : tc.status.toUpperCase();
    
    let actualHtml = tc.status === 'running' ? 'Running...' : (tc.actualOutput || '—');
    try {
       if (actualHtml.startsWith('{') || actualHtml.startsWith('[')) {
           actualHtml = JSON.stringify(JSON.parse(actualHtml), null, 2);
       }
    } catch(e){}

    let expectedHtml = tc.output || tc.expectedOutput || '';
    try {
       if (expectedHtml.startsWith('{') || expectedHtml.startsWith('[')) {
           expectedHtml = JSON.stringify(JSON.parse(expectedHtml), null, 2);
       }
    } catch(e){}

    let html = `
      <div class="case-field">
        <div class="case-field-title" style="display: flex; align-items: center; color: ${tc.status==='passed'?'var(--lime)':(tc.status==='running'?'var(--saffron)':'var(--rose)')};">
          ${statusDisplay} ${runTimeStr}
        </div>
      </div>
      <div class="case-field">
        <div class="case-field-title">Input</div>
        <div class="case-field-val">${tc.input}</div>
      </div>
      <div style="display: flex; gap: 16px; margin-top: 12px;">
        <div class="case-field" style="flex: 1;">
          <div class="case-field-title">Expected Output</div>
          <div class="case-field-val val-expected">${expectedHtml}</div>
        </div>
        <div class="case-field" style="flex: 1;">
          <div class="case-field-title">Your Output</div>
          <div class="case-field-val ${actClass}">${actualHtml}</div>
        </div>
      </div>
    `;
    document.getElementById('subCaseContent').innerHTML = html;
  }

  // ─── WEBCHANNEL INIT ───
  function setupWebChannel(cb) {
    let connected = false;
    function tryConnect() {
      if (connected) return true;
      if (typeof qt !== "undefined" && qt.webChannelTransport) {
        connected = true;
        new QWebChannel(qt.webChannelTransport, function(ch) { cb(ch); });
        return true;
      }
      return false;
    }
    if (tryConnect()) return;
    document.addEventListener("DOMContentLoaded", tryConnect);
    window.addEventListener("load", tryConnect);
    let timer = setInterval(() => { if (tryConnect()) clearInterval(timer); }, 20);
  }

  setupWebChannel(function(channel) {
    workspaceBridge = channel.objects.workspaceBridge;
    if (workspaceBridge) workspaceBridge.onWorkspaceReady();
  });

</script>
</body>
</html>
