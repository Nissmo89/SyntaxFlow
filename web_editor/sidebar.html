<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sidebar</title>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script src="qwebchannel.js"></script>
  <style>
    :root {
      --bg: #09090b;
      --border: #27272a;
      --text: #fafafa;
      --muted: #a1a1aa;
      --hover-bg: #27272a;
      --accent: #ffffff;
      --accent-fg: #000000;
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      overflow: hidden;
      user-select: none;
      height: 100vh;
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border);
      width: 100%;
      transition: background-color 0.2s;
    }

    .header {
      height: 80px;
      min-height: 80px;
      display: flex;
      align-items: center;
      padding: 0 9px;
      border-bottom: 1px solid var(--border);
      gap: 12px;
      white-space: nowrap;
    }

    .logo-icon {
      width: 32px;
      height: 32px;
      min-width: 32px;
      background: var(--accent);
      color: var(--accent-fg);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-text {
      font-size: 1.125rem;
      font-weight: 700;
      letter-spacing: -0.025em;
    }

    .nav-section {
      flex: 1;
      padding: 24px 9px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .nav-label {
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      padding: 0 4px;
      margin-bottom: 4px;
      white-space: nowrap;
      opacity: 1;
      transition: opacity 0.2s;
    }

    body.collapsed .nav-label {
      opacity: 0;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--muted);
      background: transparent;
      border: none;
      transition: all 0.2s;
      white-space: nowrap;
      text-align: left;
      outline: none;
      width: 100%;
    }

    .nav-item i {
      min-width: 20px;
      width: 20px;
      height: 20px;
    }

    .nav-item:hover {
      color: var(--text);
      background: var(--hover-bg);
    }

    .nav-item.active {
      background: var(--accent);
      color: var(--accent-fg);
    }

    .bottom-section {
      padding: 16px 9px;
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .profile-card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 6px;
      border-radius: 8px;
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .profile-card:hover {
      background: var(--hover-bg);
      border-color: var(--border);
    }

    .avatar-wrapper {
      position: relative;
      width: 32px;
      height: 32px;
      min-width: 32px;
    }

    .avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: var(--hover-bg);
      border: 1px solid var(--border);
    }

    .profile-info {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .profile-name {
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text);
    }

    .profile-mac {
      font-size: 0.625rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* Hide text when collapsed for smooth width changes */
    body.collapsed .logo-text,
    body.collapsed .nav-item span,
    body.collapsed .profile-info {
      opacity: 0;
      pointer-events: none;
    }

    .logo-text, .nav-item span, .profile-info {
      opacity: 1;
      transition: opacity 0.2s 0.1s;
    }
  </style>
</head>
<body class="collapsed">
  
  <!-- Header -->
  <div class="header">
    <div class="logo-icon">
      <i data-lucide="code-2"></i>
    </div>
    <div class="logo-text">SyntaxFlow</div>
  </div>

  <!-- Navigation -->
  <div class="nav-section">
    <div class="nav-label">Menu</div>
    
    <button class="nav-item" id="nav-editor">
      <i data-lucide="code-2"></i>
      <span>Editor</span>
    </button>
    
    <button class="nav-item active" id="nav-browser">
      <i data-lucide="layout-dashboard"></i>
      <span>Browser</span>
    </button>
  </div>

  <!-- Bottom section -->
  <div class="bottom-section">
    <button class="nav-item" id="nav-settings">
      <i data-lucide="settings"></i>
      <span>Settings</span>
    </button>

    <div class="profile-card">
      <div class="avatar-wrapper">
        <img id="avatar-img" class="avatar" src="" alt="Avatar" />
      </div>
      <div class="profile-info">
        <span class="profile-name">Local User</span>
        <span class="profile-mac" id="mac-text"></span>
      </div>
    </div>
  </div>

  <script>
    if (typeof lucide !== 'undefined') {
      lucide.createIcons();
    }

    const params = new URLSearchParams(window.location.search);
    const mac = params.get("mac") || "default";
    
    document.getElementById("avatar-img").src = `https://api.dicebear.com/9.x/identicon/svg?seed=${encodeURIComponent(mac)}`;
    document.getElementById("mac-text").innerText = mac.substring(0, 8);

    function updateSelection(index) {
      document.getElementById("nav-editor").className = index === 0 ? "nav-item active" : "nav-item";
      document.getElementById("nav-browser").className = index === 1 ? "nav-item active" : "nav-item";
    }

    let sidebarBridge = null;
    let isHovered = false;
    
    if (typeof qt !== 'undefined') {
      new QWebChannel(qt.webChannelTransport, function(channel) {
        sidebarBridge = channel.objects.sidebarBridge;
      });
    }

    // Hover logic for expanding via C++
    document.body.addEventListener('mouseenter', () => {
      isHovered = true;
      document.body.classList.remove('collapsed');
      if (sidebarBridge && sidebarBridge.hovered) {
        sidebarBridge.hovered(true);
      }
    });

    document.body.addEventListener('mouseleave', () => {
      isHovered = false;
      document.body.classList.add('collapsed');
      if (sidebarBridge && sidebarBridge.hovered) {
        sidebarBridge.hovered(false);
      }
    });

    document.getElementById("nav-editor").onclick = () => {
      updateSelection(0);
      if (sidebarBridge && sidebarBridge.navigationChanged) {
        sidebarBridge.navigationChanged(0);
      }
    };

    document.getElementById("nav-browser").onclick = () => {
      updateSelection(1);
      if (sidebarBridge && sidebarBridge.navigationChanged) {
        sidebarBridge.navigationChanged(1);
      }
    };

    document.getElementById("nav-settings").onclick = () => {
      if (sidebarBridge && sidebarBridge.bottomItemClicked) {
        sidebarBridge.bottomItemClicked(0);
      }
    };
  </script>
</body>
</html>
