<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sidebar</title>
  <link rel="stylesheet" href="design.css">
  <script src="theme.js"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script src="qwebchannel.js"></script>
  <style>
    * { margin: 0; padding: 0; }

    body {
      overflow: hidden;
      user-select: none;
      height: 100vh;
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border);
      width: 100%;
    }

    .header {
      height: 56px;
      min-height: 56px;
      display: flex;
      align-items: center;
      padding: 0 10px;
      border-bottom: 1px solid var(--border);
      gap: 10px;
      white-space: nowrap;
    }

    .logo-icon {
      width: 28px;
      height: 28px;
      min-width: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-icon img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .logo-text {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.3px;
    }

    .nav-section {
      flex: 1;
      padding: 20px 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .nav-label {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      padding: 0 8px;
      margin-bottom: 4px;
      white-space: nowrap;
      opacity: 1;
      transition: opacity 0.2s;
    }

    body.collapsed .nav-label {
      opacity: 0;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 8px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
      background: transparent;
      border: none;
      transition: background 0.15s, color 0.15s;
      white-space: nowrap;
      text-align: left;
      outline: none;
      width: 100%;
    }

    .nav-item i {
      min-width: 18px;
      width: 18px;
      height: 18px;
    }

    .nav-item:hover {
      color: var(--text);
      background: var(--bg-hover);
    }

    .nav-item.active {
      background: var(--bg-hover);
      color: var(--text);
    }

    .bottom-section {
      padding: 12px 8px;
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .profile-card {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 8px;
      border-radius: 6px;
      border: 1px solid transparent;
      cursor: pointer;
      transition: background 0.15s;
      white-space: nowrap;
    }

    .profile-card:hover {
      background: var(--bg-hover);
    }

    .avatar-wrapper {
      position: relative;
      width: 28px;
      height: 28px;
      min-width: 28px;
    }

    .avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: var(--bg-hover);
      border: 1px solid var(--border);
    }

    .profile-info {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .profile-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
    }

    .profile-mac {
      font-size: 10px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    body.collapsed .logo-text,
    body.collapsed .nav-item span,
    body.collapsed .profile-info {
      opacity: 0;
      pointer-events: none;
    }

    .logo-text, .nav-item span, .profile-info {
      opacity: 1;
      transition: opacity 0.2s 0.1s;
    }
  </style>
</head>
<body class="collapsed">
  
  <!-- Header -->
  <div class="header">
    <div class="logo-icon">
      <img src="logo.svg" alt="SyntaxFlow" />
    </div>
    <div class="logo-text">SyntaxFlow</div>
  </div>

  <!-- Navigation -->
  <div class="nav-section">
    <div class="nav-label">Menu</div>
    
    <button class="nav-item" id="nav-editor">
      <i data-lucide="code-2"></i>
      <span>Editor</span>
    </button>
    
    <button class="nav-item active" id="nav-browser">
      <i data-lucide="layout-dashboard"></i>
      <span>Browser</span>
    </button>
  </div>

  <!-- Bottom section -->
  <div class="bottom-section">
    <button class="nav-item" id="nav-settings">
      <i data-lucide="settings"></i>
      <span>Settings</span>
    </button>

    <div class="profile-card" id="nav-profile">
      <div class="avatar-wrapper">
        <img id="avatar-img" class="avatar" src="" alt="Avatar" />
      </div>
      <div class="profile-info">
        <span class="profile-name">Local User</span>
        <span class="profile-mac" id="mac-text"></span>
      </div>
    </div>
  </div>

  <script>
    if (typeof lucide !== 'undefined') {
      lucide.createIcons();
    }

    const params = new URLSearchParams(window.location.search);
    const mac = params.get("mac") || "default";
    
    document.getElementById("avatar-img").src = `https://api.dicebear.com/9.x/identicon/svg?seed=${encodeURIComponent(mac)}`;
    document.getElementById("mac-text").innerText = mac.substring(0, 8);

    function updateSelection(index) {
      document.getElementById("nav-editor").className = index === 0 ? "nav-item active" : "nav-item";
      document.getElementById("nav-browser").className = index === 1 ? "nav-item active" : "nav-item";
    }

    let sidebarBridge = null;
    let isHovered = false;
    
    if (typeof qt !== 'undefined') {
      new QWebChannel(qt.webChannelTransport, function(channel) {
        sidebarBridge = channel.objects.sidebarBridge;
      });
    }

    // Hover logic for expanding via C++
    document.body.addEventListener('mouseenter', () => {
      isHovered = true;
      document.body.classList.remove('collapsed');
      if (sidebarBridge && sidebarBridge.hovered) {
        sidebarBridge.hovered(true);
      }
    });

    document.body.addEventListener('mouseleave', () => {
      isHovered = false;
      document.body.classList.add('collapsed');
      if (sidebarBridge && sidebarBridge.hovered) {
        sidebarBridge.hovered(false);
      }
    });

    document.getElementById("nav-editor").onclick = () => {
      updateSelection(0);
      if (sidebarBridge && sidebarBridge.navigationChanged) {
        sidebarBridge.navigationChanged(0);
      }
    };

    document.getElementById("nav-browser").onclick = () => {
      updateSelection(1);
      if (sidebarBridge && sidebarBridge.navigationChanged) {
        sidebarBridge.navigationChanged(1);
      }
    };

    document.getElementById("nav-settings").onclick = () => {
      if (sidebarBridge && sidebarBridge.bottomItemClicked) {
        sidebarBridge.bottomItemClicked(0);
      }
    };

    document.getElementById("nav-profile").onclick = () => {
      if (sidebarBridge && sidebarBridge.bottomItemClicked) {
        sidebarBridge.bottomItemClicked(1);
      }
    };
  </script>
</body>
</html>
