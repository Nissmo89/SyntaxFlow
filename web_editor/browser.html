<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SyntaxFlow Problem Set</title>
  <link rel="stylesheet" href="design.css">
  <script src="qwebchannel.js"></script>
  <style>
    html, body {
      width: 100%; min-height: 100vh;
      overflow-x: hidden; overflow-y: auto;
    }

    /* ─── Header ─── */
    .header {
      position: sticky; top: 0; z-index: 100;
      display: flex; align-items: center;
      justify-content: space-between;
      padding: 12px 32px;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
    }

    .brand { display: flex; align-items: center; gap: 12px; }

    .logo {
      font-size: 16px; font-weight: 700;
      color: var(--accent);
      letter-spacing: -0.3px;
    }

    .subtitle {
      font-size: 13px; color: var(--text-muted);
      font-weight: 400;
    }

    /* ─── Controls ─── */
    .controls { display: flex; align-items: center; gap: 12px; }

    /* ─── Search ─── */
    .search-box { position: relative; }

    .search-input {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      height: 32px;
      padding: 0 34px 0 32px;
      color: var(--text);
      font-size: 13px;
      outline: none;
      width: 220px;
      transition: border-color 0.15s, box-shadow 0.15s, width 0.2s ease;
    }

    .search-input::placeholder { color: var(--text-muted); }

    .search-input:hover { border-color: var(--border-light); }

    .search-input:focus {
      border-color: rgba(92, 158, 255, 0.45);
      box-shadow: 0 0 0 3px rgba(92, 158, 255, 0.12);
      width: 260px;
    }

    .search-icon {
      position: absolute;
      left: 10px; top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
      width: 14px; height: 14px;
      transition: color 0.15s;
    }

    .search-input:focus ~ .search-icon { color: var(--accent); }

    .search-hint {
      position: absolute;
      right: 8px; top: 50%;
      transform: translateY(-50%);
      display: flex; align-items: center;
      height: 18px;
      padding: 0 6px;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-muted);
      background: var(--bg-hover);
      border: 1px solid var(--border);
      border-radius: 4px;
      pointer-events: none;
      transition: opacity 0.15s;
    }

    .search-clear {
      position: absolute;
      right: 5px; top: 50%;
      transform: translateY(-50%);
      display: none;
      align-items: center; justify-content: center;
      width: 22px; height: 22px;
      border: none; border-radius: 4px;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    .search-clear:hover {
      color: var(--text);
      background: var(--bg-hover);
    }

    .search-box:focus-within .search-hint,
    .search-box.filled .search-hint { display: none; }
    .search-box.filled .search-clear { display: flex; }

    /* ─── Filter Segmented Control ─── */
    .filter-pills {
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 3px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 6px;
    }

    .filter-btn {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      padding: 4px 12px;
      border-radius: 4px;
      font-size: 12px; font-weight: 500;
      cursor: pointer; user-select: none;
      transition: background 0.15s, color 0.15s;
    }

    .filter-btn:hover { color: var(--text); }

    .filter-btn.active {
      background: var(--bg-hover);
      color: var(--text);
      box-shadow: inset 0 0 0 1px var(--border-light);
    }

    /* ─── Stats ─── */
    .stats-card {
      display: flex; align-items: center; gap: 10px;
      padding: 6px 12px;
      font-size: 12px;
      color: var(--text-secondary);
    }

    .stats-text {
      font-family: var(--font-mono);
      font-size: 12px;
      white-space: nowrap;
    }

    .progress-bar-bg {
      width: 64px; height: 4px;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%; width: 0%;
      background: var(--success);
      transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* ─── Tags Bar ─── */
    .tags-bar {
      position: sticky; top: 49px; z-index: 99;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      padding: 8px 0;
      min-height: 36px;
      cursor: pointer;
      user-select: none;
    }

    .tags-bar-inner {
      display: flex;
      flex-wrap: nowrap;
      align-items: center;
      gap: 8px;
      max-width: 1000px;
      margin: 0 auto;
      padding: 0 32px;
      overflow: hidden;
    }

    .tags-bar.expanded .tags-bar-inner {
      flex-wrap: wrap;
      cursor: default;
    }

    .filter-tag-chip {
      font-family: var(--font-mono);
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 4px;
      background: transparent;
      color: var(--text-secondary);
      border: 1px solid var(--border);
      cursor: pointer; user-select: none;
      white-space: nowrap;
      line-height: 1;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }

    .filter-tag-chip:hover {
      background: var(--bg-surface);
      color: var(--text);
      border-color: var(--border-light);
    }

    .filter-tag-chip.active {
      background: var(--accent-dim);
      color: var(--accent);
      border-color: rgba(92, 158, 255, 0.25);
    }

    .tags-toggle {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      border-radius: 4px;
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border);
      cursor: pointer; user-select: none;
      transition: background 0.15s, color 0.15s;
      flex-shrink: 0;
      font-size: 10px;
      line-height: 1;
    }

    .tags-toggle:hover {
      background: var(--bg-surface);
      color: var(--text);
      border-color: var(--border-light);
    }

    /* ─── Container ─── */
    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 16px 32px 64px;
    }

    /* ─── Problem List (table-like rows) ─── */
    .problem-list {
      display: flex; flex-direction: column;
    }

    .list-header {
      display: flex; align-items: center;
      padding: 8px 16px 8px 12px;
      font-size: 11px; font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase; letter-spacing: 0.5px;
      border-bottom: 1px solid var(--border);
      user-select: none;
    }

    .list-header .col-status { width: 40px; }
    .list-header .col-title { flex: 1; }
    .list-header .col-difficulty { width: 100px; text-align: right; }

    .row {
      display: flex; align-items: center;
      padding: 10px 16px 10px 12px;
      cursor: pointer; user-select: none;
      border-bottom: 1px solid var(--border);
      transition: background 0.1s;
      height: 44px;
    }

    .row:hover { background: var(--bg-surface); }

    .row .col-status {
      width: 40px; display: flex; align-items: center;
      justify-content: center;
    }

    .row .col-title {
      flex: 1;
      font-size: 14px; font-weight: 500;
      color: var(--text);
      user-select: text;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .row .col-difficulty {
      width: 100px;
      text-align: right;
    }

    .difficulty-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-mono);
      font-size: 11px; font-weight: 500;
      padding: 3px 10px;
      border-radius: 999px;
      line-height: 1.4;
      letter-spacing: 0.2px;
      white-space: nowrap;
    }

    .difficulty-badge::before {
      content: '';
      width: 6px; height: 6px;
      border-radius: 50%;
      background: currentColor;
    }

    .diff-easy { color: var(--success); background: rgba(163, 230, 53, 0.1); border: 1px solid rgba(163, 230, 53, 0.35); }
    .diff-medium { color: var(--warning); background: rgba(245, 166, 35, 0.1); border: 1px solid rgba(245, 166, 35, 0.35); }
    .diff-hard { color: var(--danger); background: rgba(251, 113, 133, 0.1); border: 1px solid rgba(251, 113, 133, 0.35); }

    .status-icon {
      width: 18px; height: 18px;
      border-radius: 4px;
      display: flex; align-items: center;
      justify-content: center;
    }

    .status-icon.solved {
      color: var(--success);
    }

    .status-icon.unsolved {
      border: 1.5px solid var(--border-light);
      border-radius: 50%;
    }

    .row:hover .status-icon.unsolved {
      border-color: var(--text-muted);
    }

    /* ─── Empty State ─── */
    .empty-state {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 80px 32px; text-align: center;
    }

    .empty-state-icon {
      font-size: 40px; margin-bottom: 16px;
      opacity: 0.15;
    }

    .empty-state-title {
      font-size: 16px; font-weight: 500;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    .empty-state-desc {
      font-size: 13px;
      color: var(--text-muted);
      max-width: 380px; line-height: 1.5;
    }

    .clear-filters-btn {
      margin-top: 20px;
      padding: 7px 18px;
      background: var(--accent-dim);
      border: 1px solid rgba(92, 158, 255, 0.2);
      color: var(--accent);
      border-radius: 4px;
      font-size: 13px; font-weight: 500;
      cursor: pointer; user-select: none;
      transition: background 0.15s;
    }

    .clear-filters-btn:hover {
      background: rgba(92, 158, 255, 0.2);
    }

  </style>
</head>
<body>

<div class="header">
  <div class="brand">
    <span class="logo">SyntaxFlow</span>
    <span class="subtitle">Problem Set</span>
  </div>

  <div class="controls">
    <div class="search-box" id="searchBox">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="searchInput" class="search-input" placeholder="Search problems or tags..." aria-label="Search problems or tags">
      <span class="search-hint" id="searchHint">/</span>
      <button type="button" class="search-clear" id="searchClear" aria-label="Clear search" onclick="clearSearch()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="12" height="12"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>

    <div class="filter-pills">
      <button class="filter-btn active" onclick="setFilter('all')">All</button>
      <button class="filter-btn" onclick="setFilter('easy')">Easy</button>
      <button class="filter-btn" onclick="setFilter('medium')">Medium</button>
      <button class="filter-btn" onclick="setFilter('hard')">Hard</button>
    </div>

    <div class="stats-card">
      <div class="progress-bar-bg">
        <div id="progressFill" class="progress-bar-fill"></div>
      </div>
      <span id="statsText" class="stats-text">0 / 0 Solved</span>
    </div>
  </div>
</div>

<div class="tags-bar" id="tagsBar" style="display: none;">
  <div class="tags-bar-inner" id="tagsBarInner"></div>
</div>

<div class="container">
  <div id="problemList" class="problem-list">
    <div class="list-header" id="listHeader" style="display: none;">
      <span class="col-status"></span>
      <span class="col-title">Problem</span>
      <span class="col-difficulty">Difficulty</span>
    </div>
  </div>
</div>

<script>
  var browserBridge = null;
  var allProblems = [];
  var solvedMap = {};
  var currentFilter = 'all';
  var searchQuery = '';
  var pendingPaths = [];
  var selectedTags = new Set();

  function flushPendingPaths() {
    if (!browserBridge || typeof browserBridge.openProblem !== 'function') {
      return;
    }

    while (pendingPaths.length > 0) {
      var path = pendingPaths.shift();
      console.log("Executing queued openProblem:", path);
      browserBridge.openProblem(path);
    }
  }

  window.openProblemPath = function(path) {
    if (browserBridge && typeof browserBridge.openProblem === 'function') {
      browserBridge.openProblem(path);
    } else {
      console.warn("browserBridge not ready yet, queuing:", path);
      pendingPaths.push(path);
    }
  };

  window.loadProblems = function(problemsJson, solvedData) {
    if (typeof problemsJson === 'string') {
      try { allProblems = JSON.parse(problemsJson); } catch(e){}
    } else {
      allProblems = problemsJson || [];
    }

    if (solvedData) {
      solvedMap = solvedData;
    }

    renderTags();
    render();
  };

  window.updateProgress = function(solvedData) {
    solvedMap = solvedData || {};
    render();
  };

  function setupWebChannel(callback) {
    var connected = false;
    function tryConnect() {
      if (connected) return true;
      if (typeof qt !== "undefined" && qt.webChannelTransport) {
        connected = true;
        new QWebChannel(qt.webChannelTransport, function(channel) {
          callback(channel);
        });
        return true;
      }
      return false;
    }

    if (tryConnect()) return;

    document.addEventListener("DOMContentLoaded", tryConnect);
    window.addEventListener("load", tryConnect);

    var timer = setInterval(function() {
      if (tryConnect()) {
        clearInterval(timer);
      }
    }, 20);
  }

  setupWebChannel(function(channel) {
    console.log("QWebChannel connected in browser.html", channel.objects);
    browserBridge = channel.objects.browserBridge;
    window.browserBridge = browserBridge;

    if (browserBridge && browserBridge.onBrowserReady) {
      browserBridge.onBrowserReady();
    }

    flushPendingPaths();
  });

  function resetFilters() {
    currentFilter = 'all';
    searchQuery = '';
    selectedTags.clear();
    searchInput.value = '';
    document.getElementById('searchBox').classList.remove('filled');
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.classList.toggle('active', btn.textContent.toLowerCase() === 'all');
    });
    document.querySelectorAll('.filter-tag-chip').forEach(chip => {
      chip.classList.remove('active');
    });
    render();
  }

  function setFilter(filter) {
    currentFilter = filter;
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.classList.toggle('active', btn.textContent.toLowerCase() === filter);
    });
    render();
  }

  var tagsExpanded = false;

  function toggleTags() {
    tagsExpanded = !tagsExpanded;
    var outer = document.getElementById('tagsBar');
    outer.classList.toggle('expanded', tagsExpanded);
    var inner = document.getElementById('tagsBarInner');
    var chips = inner.querySelectorAll('.filter-tag-chip');
    if (tagsExpanded) {
      chips.forEach(function(c) { c.style.display = ''; });
    } else {
      renderTags();
      return;
    }
    var toggle = inner.querySelector('.tags-toggle');
    if (toggle) {
      toggle.textContent = '▲';
      toggle.title = 'Show less';
    }
  }

  function renderTags() {
    var tagSet = new Set();
    allProblems.forEach(function(p) {
      (p.topics || []).forEach(function(t) { tagSet.add(t); });
    });
    var sortedTags = Array.from(tagSet).sort();
    
    var outer = document.getElementById('tagsBar');
    var inner = document.getElementById('tagsBarInner');
    inner.innerHTML = '';
    outer.classList.toggle('expanded', tagsExpanded);
    outer.onclick = function(e) {
      if (e.target === outer && !tagsExpanded) {
        toggleTags();
        outer.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    };
    
    if (sortedTags.length === 0) {
      outer.style.display = 'none';
      return;
    }
    outer.style.display = 'block';

    sortedTags.forEach(function(tag) {
      var chip = document.createElement('div');
      chip.className = 'filter-tag-chip' + (selectedTags.has(tag) ? ' active' : '');
      chip.textContent = tag;
      chip.onclick = function(e) {
        e.stopPropagation();
        if (selectedTags.has(tag)) {
          selectedTags.delete(tag);
        } else {
          selectedTags.add(tag);
        }
        chip.className = 'filter-tag-chip' + (selectedTags.has(tag) ? ' active' : '');
        render();
      };
      inner.appendChild(chip);
    });

    if (tagsExpanded) {
      var showLess = document.createElement('div');
      showLess.className = 'tags-toggle';
      showLess.textContent = '▲';
      showLess.title = 'Show less';
      showLess.onclick = function(e) {
        e.stopPropagation();
        toggleTags();
      };
      inner.appendChild(showLess);
      return;
    }

    // Collapsed: measure and trim overflow
    requestAnimationFrame(function() {
      if (sortedTags.length === 0) return;
      var chips = inner.querySelectorAll('.filter-tag-chip');
      if (chips.length === 0) return;

      var gap = 8;
      var containerW = inner.clientWidth;
      var totalW = 0;
      var fitCount = 0;

      for (var i = 0; i < chips.length; i++) {
        var chipW = chips[i].offsetWidth;
        var withGap = chipW + (fitCount > 0 ? gap : 0);
        if (totalW + withGap <= containerW) {
          totalW += withGap;
          fitCount++;
        } else {
          break;
        }
      }

      if (fitCount >= chips.length) return;

      var hiddenCount = chips.length - fitCount;

      // Remove last visible chip if toggle won't fit
      var toggleEstimate = 80;
      if (totalW + gap + toggleEstimate > containerW && fitCount > 1) {
        chips[fitCount - 1].style.display = 'none';
        hiddenCount++;
        fitCount--;
      }

      for (var j = fitCount; j < chips.length; j++) {
        chips[j].style.display = 'none';
      }

      var toggleBtn = document.createElement('div');
      toggleBtn.className = 'tags-toggle';
      toggleBtn.dataset.count = hiddenCount;
      toggleBtn.title = 'Show ' + hiddenCount + ' more';
      toggleBtn.textContent = '▼';
      toggleBtn.onclick = function(e) {
        e.stopPropagation();
        toggleTags();
      };
      inner.appendChild(toggleBtn);
    });
  }

  var searchInput = document.getElementById('searchInput');

  searchInput.addEventListener('input', function(e) {
    searchQuery = e.target.value.toLowerCase().trim();
    document.getElementById('searchBox').classList.toggle('filled', searchQuery.length > 0);
    render();
  });

  searchInput.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && searchQuery) {
      e.preventDefault();
      clearSearch();
    }
  });

  function clearSearch() {
    searchQuery = '';
    searchInput.value = '';
    document.getElementById('searchBox').classList.remove('filled');
    render();
    searchInput.focus();
  }

  document.addEventListener('keydown', function(e) {
    var tag = document.activeElement && document.activeElement.tagName;
    if (e.key === '/' && tag !== 'INPUT' && tag !== 'TEXTAREA' && tag !== 'SELECT') {
      e.preventDefault();
      searchInput.focus();
    }
  });

  function render() {
    var container = document.getElementById('problemList');
    var headerEl = document.getElementById('listHeader');

    var total = allProblems.length;
    var solvedCount = 0;

    var filtered = allProblems.filter(function(p) {
      var isSolved = !!solvedMap[p.id];
      if (isSolved) solvedCount++;

      var diffMatch = (currentFilter === 'all' || (p.difficulty || '').toLowerCase() === currentFilter);
      var searchMatch = !searchQuery || 
        (p.title || '').toLowerCase().includes(searchQuery) ||
        (p.id || '').toLowerCase().includes(searchQuery) ||
        (p.topics || []).some(t => t.toLowerCase().includes(searchQuery));

      var tagMatch = true;
      if (selectedTags.size > 0) {
        tagMatch = false;
        var pTopics = p.topics || [];
        for (let tag of selectedTags) {
          if (pTopics.includes(tag)) {
            tagMatch = true;
            break;
          }
        }
      }

      return diffMatch && searchMatch && tagMatch;
    });

    // Update Header Stats
    document.getElementById('statsText').textContent = solvedCount + ' / ' + total + ' Solved';
    var pct = total > 0 ? (solvedCount / total * 100) : 0;
    document.getElementById('progressFill').style.width = pct + '%';

    // Remove old rows (keep header)
    var rows = container.querySelectorAll('.row');
    for (var i = rows.length - 1; i >= 0; i--) {
      rows[i].remove();
    }

    if (filtered.length === 0) {
      headerEl.style.display = 'none';
      var emptyEl = document.createElement('div');
      emptyEl.className = 'empty-state';
      var hasAnyFilter = currentFilter !== 'all' || searchQuery || selectedTags.size > 0;
      emptyEl.innerHTML = hasAnyFilter
        ? '<div class="empty-state-icon">🔍</div><div class="empty-state-title">No problems found</div><div class="empty-state-desc">Try adjusting your search or filters.</div><button class="clear-filters-btn" onclick="resetFilters()">Clear all filters</button>'
        : '<div class="empty-state-icon">📝</div><div class="empty-state-title">No problems loaded</div><div class="empty-state-desc">Problems will appear here once loaded from the data source.</div>';
      container.appendChild(emptyEl);
      return;
    }

    headerEl.style.display = 'flex';
    var fragment = document.createDocumentFragment();

    filtered.forEach(function(p) {
      var row = document.createElement('div');
      var diffClass = (p.difficulty || 'easy').toLowerCase();
      var isSolved = !!solvedMap[p.id];

      row.className = 'row ' + diffClass;
      row.onclick = function() {
        window.openProblemPath(p.path);
      };

      var statusIcon = isSolved
        ? '<svg class="status-icon solved" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><polyline points="20 6 9 17 4 12"/></svg>'
        : '<div class="status-icon unsolved"></div>';

      row.innerHTML = `
        <div class="col-status">${statusIcon}</div>
        <div class="col-title">${escapeHtml(p.title || '')}</div>
        <div class="col-difficulty"><span class="difficulty-badge diff-${diffClass}">${escapeHtml(p.difficulty || 'Easy')}</span></div>
      `;

      fragment.appendChild(row);
    });

    container.appendChild(fragment);
  }

  function escapeHtml(str) {
    return (str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
</script>

</body>
</html>
