<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SyntaxFlow Problem Set</title>
  <link rel="stylesheet" href="design.css">
  <script src="theme.js"></script>
  <script src="qwebchannel.js"></script>
  <style>
    html, body {
      width: 100%; min-height: 100vh;
      overflow-x: hidden; overflow-y: auto;
    }

    /* ─── Header ─── */
    .header {
      position: sticky; top: 0; z-index: 100;
      display: flex; align-items: center;
      justify-content: space-between;
      padding: 12px 32px;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
    }

    .brand { display: flex; align-items: center; gap: 12px; }

    .logo-img {
      height: 24px;
      width: auto;
    }

    .subtitle {
      font-size: 13px; color: var(--text-muted);
      font-weight: 400;
    }

    /* ─── Controls ─── */
    .controls { display: flex; align-items: center; gap: 12px; }

    /* ─── Search ─── */
    .search-box { position: relative; flex: 1; max-width: 260px; min-width: 170px; }

    .search-input {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      height: 32px;
      padding: 0 34px 0 32px;
      color: var(--text);
      font-size: 13px;
      outline: none;
      width: 100%;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .search-input::placeholder { color: var(--text-muted); }

    .search-input:hover { border-color: var(--border-light); }

    .search-input:focus {
      border-color: rgba(92, 158, 255, 0.45);
      box-shadow: 0 0 0 3px rgba(92, 158, 255, 0.12);
    }

    .search-icon {
      position: absolute;
      left: 10px; top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
      width: 14px; height: 14px;
      transition: color 0.15s;
    }

    .search-input:focus ~ .search-icon { color: var(--accent); }

    .search-hint {
      position: absolute;
      right: 8px; top: 50%;
      transform: translateY(-50%);
      display: flex; align-items: center;
      height: 18px;
      padding: 0 6px;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-muted);
      background: var(--bg-hover);
      border: 1px solid var(--border);
      border-radius: 4px;
      pointer-events: none;
      transition: opacity 0.15s;
    }

    .search-clear {
      position: absolute;
      right: 5px; top: 50%;
      transform: translateY(-50%);
      display: none;
      align-items: center; justify-content: center;
      width: 22px; height: 22px;
      border: none; border-radius: 4px;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    .search-clear:hover {
      color: var(--text);
      background: var(--bg-hover);
    }

    .search-box:focus-within .search-hint,
    .search-box.filled .search-hint { display: none; }
    .search-box.filled .search-clear { display: flex; }

    /* ─── List Toolbar ─── */
    .list-toolbar {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 14px 0 16px;
      flex-wrap: wrap;
    }

    .list-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .toolbar-spacer { flex: 1; }

    .list-actions-right {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .problems-count {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text-secondary);
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 2px 10px;
      line-height: 1.4;
      white-space: nowrap;
    }

    /* ─── Dropdowns (Sort / Filter) ─── */
    .dropdown { position: relative; }

    .icon-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px; height: 32px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-secondary);
      cursor: pointer; user-select: none;
      flex-shrink: 0;
      position: relative;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
    }

    .icon-btn svg { width: 15px; height: 15px; }

    .icon-btn:hover {
      border-color: var(--border-light);
      color: var(--text);
      background: var(--bg-hover);
    }

    .icon-btn:active { background: var(--bg-hover); }

    .dropdown.open .icon-btn {
      border-color: var(--accent);
      color: var(--accent);
    }

    .icon-btn.active {
      color: var(--accent);
      border-color: rgba(92, 158, 255, 0.4);
      background: var(--accent-dim);
    }

    .icon-btn .indicator-dot {
      position: absolute;
      top: 5px; right: 5px;
      width: 5px; height: 5px;
      border-radius: 50%;
      background: var(--accent);
      border: 1px solid var(--bg-surface);
      display: none;
    }

    .icon-btn.active .indicator-dot { display: block; }

    .dropdown-menu {
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      min-width: 230px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      z-index: 200;
      padding: 6px;
      display: none;
    }

    .dropdown.open .dropdown-menu { display: block; }

    .menu-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 13px;
      color: var(--text-secondary);
      cursor: pointer; user-select: none;
      white-space: nowrap;
      transition: background 0.12s, color 0.12s;
    }

    .menu-item:hover {
      background: var(--bg-hover);
      color: var(--text);
    }

    .menu-item.selected {
      color: var(--accent);
      font-weight: 500;
      background: var(--accent-dim);
    }

    .menu-item.selected::after {
      content: '✓';
      margin-left: auto;
      font-size: 12px;
    }

    .menu-section {
      padding: 6px 0;
      border-top: 1px solid var(--border);
    }

    .menu-section:first-child { border-top: none; padding-top: 2px; }

    .menu-section-title {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: var(--text-muted);
      padding: 4px 10px 4px;
    }

    .menu-check {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 13px;
      color: var(--text-secondary);
      cursor: pointer; user-select: none;
      transition: background 0.12s, color 0.12s;
    }

    .menu-check:hover {
      background: var(--bg-hover);
      color: var(--text);
    }

    .menu-check input { accent-color: var(--accent); margin: 0; }

    .menu-footer {
      display: flex;
      justify-content: flex-end;
      padding: 8px 6px 2px;
      border-top: 1px solid var(--border);
    }

    .menu-btn {
      background: transparent;
      border: none;
      color: var(--accent);
      font-size: 12px; font-weight: 500;
      cursor: pointer;
      padding: 6px 10px;
      border-radius: 6px;
      transition: background 0.12s;
    }

    .menu-btn:hover { background: var(--accent-dim); }

    /* ─── Pick One ─── */
    .icon-btn.pick-one {
      color: var(--accent);
      border-color: rgba(92, 158, 255, 0.35);
      background: var(--accent-dim);
    }

    .icon-btn.pick-one:hover {
      background: rgba(92, 158, 255, 0.2);
      border-color: rgba(92, 158, 255, 0.55);
    }

    .icon-btn.pick-one:active {
      background: rgba(92, 158, 255, 0.28);
      transform: translateY(1px);
    }

    /* ─── Stats ─── */
    .stats-card {
      display: flex; align-items: center; gap: 10px;
      padding: 6px 12px;
      font-size: 12px;
      color: var(--text-secondary);
    }

    .stats-text {
      font-family: var(--font-mono);
      font-size: 12px;
      white-space: nowrap;
    }

    .progress-bar-bg {
      width: 64px; height: 4px;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%; width: 0%;
      background: var(--success);
      transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* ─── Tags Bar ─── */
    .tags-bar {
      position: sticky; top: 49px; z-index: 99;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      padding: 8px 0;
      min-height: 36px;
      cursor: pointer;
      user-select: none;
    }

    .tags-bar-inner {
      display: flex;
      flex-wrap: nowrap;
      align-items: center;
      gap: 8px;
      max-width: 1000px;
      margin: 0 auto;
      padding: 0 32px;
      overflow: hidden;
    }

    .tags-bar.expanded .tags-bar-inner {
      flex-wrap: wrap;
      cursor: default;
    }

    .filter-tag-chip {
      font-family: var(--font-mono);
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 4px;
      background: transparent;
      color: var(--text-secondary);
      border: 1px solid var(--border);
      cursor: pointer; user-select: none;
      white-space: nowrap;
      line-height: 1;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }

    .filter-tag-chip:hover {
      background: var(--bg-surface);
      color: var(--text);
      border-color: var(--border-light);
    }

    .filter-tag-chip.active {
      background: var(--accent-dim);
      color: var(--accent);
      border-color: rgba(92, 158, 255, 0.25);
    }

    .tags-toggle {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      border-radius: 4px;
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border);
      cursor: pointer; user-select: none;
      transition: background 0.15s, color 0.15s;
      flex-shrink: 0;
      font-size: 10px;
      line-height: 1;
    }

    .tags-toggle:hover {
      background: var(--bg-surface);
      color: var(--text);
      border-color: var(--border-light);
    }

    /* ─── Container ─── */
    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 16px 32px 64px;
    }

    /* ─── Problem List (table-like rows) ─── */
    .problem-list {
      display: flex; flex-direction: column;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      background: var(--bg);
    }

    .list-header {
      display: flex; align-items: center;
      padding: 8px 16px 8px 12px;
      font-size: 11px; font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase; letter-spacing: 0.5px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-surface);
      user-select: none;
    }

    .list-header .col-status { width: 40px; }
    .list-header .col-title { flex: 1; }
    .list-header .col-difficulty { width: 100px; text-align: right; }

    .row {
      display: flex; align-items: center;
      padding: 10px 16px 10px 12px;
      cursor: pointer; user-select: none;
      border-bottom: 1px solid var(--border);
      transition: background 0.1s;
      height: 44px;
    }

    .row:last-child { border-bottom: none; }

    .row:hover { background: var(--bg-surface); }

    .row .col-status {
      width: 40px; display: flex; align-items: center;
      justify-content: center;
    }

    .row .col-title {
      flex: 1;
      font-size: 14px; font-weight: 500;
      color: var(--text);
      user-select: text;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .row .col-difficulty {
      width: 100px;
      text-align: right;
    }

    .difficulty-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-mono);
      font-size: 11px; font-weight: 500;
      padding: 3px 10px;
      border-radius: 999px;
      line-height: 1.4;
      letter-spacing: 0.2px;
      white-space: nowrap;
    }

    .difficulty-badge::before {
      content: '';
      width: 6px; height: 6px;
      border-radius: 50%;
      background: currentColor;
    }

    .diff-easy { color: var(--success); background: rgba(163, 230, 53, 0.1); border: 1px solid rgba(163, 230, 53, 0.35); }
    .diff-medium { color: var(--warning); background: rgba(245, 166, 35, 0.1); border: 1px solid rgba(245, 166, 35, 0.35); }
    .diff-hard { color: var(--danger); background: rgba(251, 113, 133, 0.1); border: 1px solid rgba(251, 113, 133, 0.35); }

    .status-icon {
      width: 18px; height: 18px;
      border-radius: 4px;
      display: flex; align-items: center;
      justify-content: center;
    }

    .status-icon.solved {
      color: var(--success);
    }

    .status-icon.unsolved {
      border: 1.5px solid var(--border-light);
      border-radius: 50%;
    }

    .row:hover .status-icon.unsolved {
      border-color: var(--text-muted);
    }

    /* ─── Empty State ─── */
    .empty-state {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 80px 32px; text-align: center;
    }

    .empty-state-icon {
      font-size: 40px; margin-bottom: 16px;
      opacity: 0.15;
    }

    .empty-state-title {
      font-size: 16px; font-weight: 500;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    .empty-state-desc {
      font-size: 13px;
      color: var(--text-muted);
      max-width: 380px; line-height: 1.5;
    }

    .clear-filters-btn {
      margin-top: 20px;
      padding: 7px 18px;
      background: var(--accent-dim);
      border: 1px solid rgba(92, 158, 255, 0.2);
      color: var(--accent);
      border-radius: 4px;
      font-size: 13px; font-weight: 500;
      cursor: pointer; user-select: none;
      transition: background 0.15s;
    }

    .clear-filters-btn:hover {
      background: rgba(92, 158, 255, 0.2);
    }

  </style>
</head>
<body>

<div class="header">
  <div class="brand">
    <img src="logo.svg" class="logo-img" alt="SyntaxFlow" />
    <span class="subtitle">Problem Set</span>
  </div>

  <div class="controls">
    <div class="stats-card">
      <div class="progress-bar-bg">
        <div id="progressFill" class="progress-bar-fill"></div>
      </div>
      <span id="statsText" class="stats-text">0 / 0 Solved</span>
    </div>
  </div>
</div>

<div class="tags-bar" id="tagsBar" style="display: none;">
  <div class="tags-bar-inner" id="tagsBarInner"></div>
</div>
<div class="container">
  <div class="list-toolbar">
    <div class="list-actions">
      <div class="search-box" id="searchBox">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="searchInput" class="search-input" placeholder="Search problems or tags..." aria-label="Search problems or tags">
        <span class="search-hint" id="searchHint">/</span>
        <button type="button" class="search-clear" id="searchClear" aria-label="Clear search" onclick="clearSearch()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="12" height="12"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>

      <div class="dropdown" id="sortDropdown">
        <button type="button" class="icon-btn" id="sortToggle" title="Sort problems" aria-label="Sort problems">
          <span class="indicator-dot"></span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 16 4 4 4-4"/><path d="M7 20V4"/><path d="m21 8-4-4-4 4"/><path d="M17 4v16"/></svg>
        </button>
        <div class="dropdown-menu">
          <div class="menu-item selected" data-sort="default">Default</div>
          <div class="menu-item" data-sort="diff-asc">Difficulty (Easy → Hard)</div>
          <div class="menu-item" data-sort="diff-desc">Difficulty (Hard → Easy)</div>
          <div class="menu-item" data-sort="title-asc">Title (A → Z)</div>
          <div class="menu-item" data-sort="title-desc">Title (Z → A)</div>
        </div>
      </div>

      <div class="dropdown" id="filterDropdown">
        <button type="button" class="icon-btn" id="filterToggle" title="Filter problems" aria-label="Filter problems">
          <span class="indicator-dot"></span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 20a1 1 0 0 0 .553.895l2 1A1 1 0 0 0 14 21v-7a2 2 0 0 1 .517-1.341L21.74 4.67A1 1 0 0 0 21 3H3a1 1 0 0 0-.742 1.67l7.225 7.989A2 2 0 0 1 10 14z"/></svg>
        </button>
        <div class="dropdown-menu">
          <div class="menu-section">
            <div class="menu-section-title">Difficulty</div>
            <label class="menu-check"><input type="checkbox" data-diff="easy" checked> Easy</label>
            <label class="menu-check"><input type="checkbox" data-diff="medium" checked> Medium</label>
            <label class="menu-check"><input type="checkbox" data-diff="hard" checked> Hard</label>
          </div>
          <div class="menu-section">
            <div class="menu-section-title">Status</div>
            <label class="menu-check"><input type="checkbox" data-status="solved" checked> Solved</label>
            <label class="menu-check"><input type="checkbox" data-status="unsolved" checked> Unsolved</label>
          </div>
          <div class="menu-footer">
            <button type="button" class="menu-btn" id="filterReset">Reset</button>
          </div>
        </div>
      </div>
    </div>

    <div class="toolbar-spacer"></div>

    <div class="list-actions-right">
      <span class="problems-count" id="problemsCount">0</span>
      <button type="button" class="icon-btn pick-one" id="pickOneBtn" title="Pick a random problem" aria-label="Pick a random problem">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="12" height="12" x="2" y="10" rx="2" ry="2"/><path d="m17.92 14 3.5-3.5a2.24 2.24 0 0 0 0-3l-5-4.92a2.24 2.24 0 0 0-3 0L10 6"/><path d="M6 18h.01"/><path d="M10 14h.01"/><path d="M15 6h.01"/><path d="M18 9h.01"/></svg>
      </button>
    </div>
  </div>

  <div id="problemList" class="problem-list">
    <div class="list-header" id="listHeader" style="display: none;">
      <span class="col-status"></span>
      <span class="col-title">Problem</span>
      <span class="col-difficulty">Difficulty</span>
    </div>
  </div>
</div>

<script>
  var browserBridge = null;
  var allProblems = [];
  var solvedMap = {};
  var searchQuery = '';
  var pendingPaths = [];
  var selectedTags = new Set();
  var currentSort = 'default';
  var diffFilter = { easy: true, medium: true, hard: true };
  var statusFilter = { solved: true, unsolved: true };
  var diffOrder = { easy: 0, medium: 1, hard: 2 };

  function flushPendingPaths() {
    if (!browserBridge || typeof browserBridge.openProblem !== 'function') {
      return;
    }

    while (pendingPaths.length > 0) {
      var path = pendingPaths.shift();
      console.log("Executing queued openProblem:", path);
      browserBridge.openProblem(path);
    }
  }

  window.openProblemPath = function(path) {
    if (browserBridge && typeof browserBridge.openProblem === 'function') {
      browserBridge.openProblem(path);
    } else {
      console.warn("browserBridge not ready yet, queuing:", path);
      pendingPaths.push(path);
    }
  };

  window.loadProblems = function(problemsJson, solvedData) {
    if (typeof problemsJson === 'string') {
      try { allProblems = JSON.parse(problemsJson); } catch(e){}
    } else {
      allProblems = problemsJson || [];
    }

    if (solvedData) {
      solvedMap = solvedData;
    }

    renderTags();
    render();
  };

  window.updateProgress = function(solvedData) {
    solvedMap = solvedData || {};
    render();
  };

  function setupWebChannel(callback) {
    var connected = false;
    function tryConnect() {
      if (connected) return true;
      if (typeof qt !== "undefined" && qt.webChannelTransport) {
        connected = true;
        new QWebChannel(qt.webChannelTransport, function(channel) {
          callback(channel);
        });
        return true;
      }
      return false;
    }

    if (tryConnect()) return;

    document.addEventListener("DOMContentLoaded", tryConnect);
    window.addEventListener("load", tryConnect);

    var timer = setInterval(function() {
      if (tryConnect()) {
        clearInterval(timer);
      }
    }, 20);
  }

  setupWebChannel(function(channel) {
    console.log("QWebChannel connected in browser.html", channel.objects);
    browserBridge = channel.objects.browserBridge;
    window.browserBridge = browserBridge;

    if (browserBridge && browserBridge.onBrowserReady) {
      browserBridge.onBrowserReady();
    }

    flushPendingPaths();
  });

  function resetFilters() {
    currentSort = 'default';
    searchQuery = '';
    selectedTags.clear();
    diffFilter = { easy: true, medium: true, hard: true };
    statusFilter = { solved: true, unsolved: true };
    searchInput.value = '';
    document.getElementById('searchBox').classList.remove('filled');
    document.querySelectorAll('#filterDropdown input').forEach(input => {
      input.checked = true;
    });
    syncFilterButton();
    setSort('default');
  }

  function setSort(sort) {
    currentSort = sort;
    document.querySelectorAll('#sortDropdown .menu-item').forEach(item => {
      item.classList.toggle('selected', item.dataset.sort === sort);
    });
    document.getElementById('sortToggle').classList.toggle('active', sort !== 'default');
    render();
  }

  function syncFilterButton() {
    var isDefault = diffFilter.easy && diffFilter.medium && diffFilter.hard &&
                    statusFilter.solved && statusFilter.unsolved;
    document.getElementById('filterToggle').classList.toggle('active', !isDefault);
  }

  function setFilterToggle(checked, key, map) {
    map[key] = checked;
    syncFilterButton();
    render();
  }

  function toggleDropdown(id) {
    var dd = document.getElementById(id);
    var open = dd.classList.contains('open');
    document.querySelectorAll('.dropdown.open').forEach(function(d) {
      d.classList.remove('open');
    });
    if (!open) dd.classList.add('open');
  }

  document.addEventListener('click', function(e) {
    if (!e.target.closest || !e.target.closest('.dropdown')) {
      document.querySelectorAll('.dropdown.open').forEach(function(d) {
        d.classList.remove('open');
      });
    }
  });

  function pickRandomProblem() {
    var filtered = getFiltered();
    if (filtered.length === 0) return;
    var p = filtered[Math.floor(Math.random() * filtered.length)];
    window.openProblemPath(p.path);
  }

  var tagsExpanded = false;

  function toggleTags() {
    tagsExpanded = !tagsExpanded;
    var outer = document.getElementById('tagsBar');
    outer.classList.toggle('expanded', tagsExpanded);
    var inner = document.getElementById('tagsBarInner');
    var chips = inner.querySelectorAll('.filter-tag-chip');
    if (tagsExpanded) {
      chips.forEach(function(c) { c.style.display = ''; });
    } else {
      renderTags();
      return;
    }
    var toggle = inner.querySelector('.tags-toggle');
    if (toggle) {
      toggle.textContent = '▲';
      toggle.title = 'Show less';
    }
  }

  function renderTags() {
    var tagSet = new Set();
    allProblems.forEach(function(p) {
      (p.topics || []).forEach(function(t) { tagSet.add(t); });
    });
    var sortedTags = Array.from(tagSet).sort();
    
    var outer = document.getElementById('tagsBar');
    var inner = document.getElementById('tagsBarInner');
    inner.innerHTML = '';
    outer.classList.toggle('expanded', tagsExpanded);
    outer.onclick = function(e) {
      if (e.target === outer && !tagsExpanded) {
        toggleTags();
        outer.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    };
    
    if (sortedTags.length === 0) {
      outer.style.display = 'none';
      return;
    }
    outer.style.display = 'block';

    sortedTags.forEach(function(tag) {
      var chip = document.createElement('div');
      chip.className = 'filter-tag-chip' + (selectedTags.has(tag) ? ' active' : '');
      chip.textContent = tag;
      chip.onclick = function(e) {
        e.stopPropagation();
        if (selectedTags.has(tag)) {
          selectedTags.delete(tag);
        } else {
          selectedTags.add(tag);
        }
        chip.className = 'filter-tag-chip' + (selectedTags.has(tag) ? ' active' : '');
        render();
      };
      inner.appendChild(chip);
    });

    if (tagsExpanded) {
      var showLess = document.createElement('div');
      showLess.className = 'tags-toggle';
      showLess.textContent = '▲';
      showLess.title = 'Show less';
      showLess.onclick = function(e) {
        e.stopPropagation();
        toggleTags();
      };
      inner.appendChild(showLess);
      return;
    }

    // Collapsed: measure and trim overflow
    requestAnimationFrame(function() {
      if (sortedTags.length === 0) return;
      var chips = inner.querySelectorAll('.filter-tag-chip');
      if (chips.length === 0) return;

      var gap = 8;
      var containerW = inner.clientWidth;
      var totalW = 0;
      var fitCount = 0;

      for (var i = 0; i < chips.length; i++) {
        var chipW = chips[i].offsetWidth;
        var withGap = chipW + (fitCount > 0 ? gap : 0);
        if (totalW + withGap <= containerW) {
          totalW += withGap;
          fitCount++;
        } else {
          break;
        }
      }

      if (fitCount >= chips.length) return;

      var hiddenCount = chips.length - fitCount;

      // Remove last visible chip if toggle won't fit
      var toggleEstimate = 80;
      if (totalW + gap + toggleEstimate > containerW && fitCount > 1) {
        chips[fitCount - 1].style.display = 'none';
        hiddenCount++;
        fitCount--;
      }

      for (var j = fitCount; j < chips.length; j++) {
        chips[j].style.display = 'none';
      }

      var toggleBtn = document.createElement('div');
      toggleBtn.className = 'tags-toggle';
      toggleBtn.dataset.count = hiddenCount;
      toggleBtn.title = 'Show ' + hiddenCount + ' more';
      toggleBtn.textContent = '▼';
      toggleBtn.onclick = function(e) {
        e.stopPropagation();
        toggleTags();
      };
      inner.appendChild(toggleBtn);
    });
  }

  var searchInput = document.getElementById('searchInput');

  searchInput.addEventListener('input', function(e) {
    searchQuery = e.target.value.toLowerCase().trim();
    document.getElementById('searchBox').classList.toggle('filled', searchQuery.length > 0);
    render();
  });

  searchInput.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && searchQuery) {
      e.preventDefault();
      clearSearch();
    }
  });

  function clearSearch() {
    searchQuery = '';
    searchInput.value = '';
    document.getElementById('searchBox').classList.remove('filled');
    render();
    searchInput.focus();
  }

  document.addEventListener('keydown', function(e) {
    var tag = document.activeElement && document.activeElement.tagName;
    if (e.key === '/' && tag !== 'INPUT' && tag !== 'TEXTAREA' && tag !== 'SELECT') {
      e.preventDefault();
      searchInput.focus();
    }
  });

  // ─── Sort / Filter dropdowns ───
  document.getElementById('sortToggle').addEventListener('click', function(e) {
    e.stopPropagation();
    toggleDropdown('sortDropdown');
  });

  document.querySelectorAll('#sortDropdown .menu-item').forEach(function(item) {
    item.addEventListener('click', function() {
      setSort(item.dataset.sort);
      document.getElementById('sortDropdown').classList.remove('open');
    });
  });

  document.getElementById('filterToggle').addEventListener('click', function(e) {
    e.stopPropagation();
    toggleDropdown('filterDropdown');
  });

  document.querySelectorAll('#filterDropdown input').forEach(function(input) {
    input.addEventListener('change', function() {
      if (input.dataset.diff) {
        setFilterToggle(input.checked, input.dataset.diff, diffFilter);
      } else if (input.dataset.status) {
        setFilterToggle(input.checked, input.dataset.status, statusFilter);
      }
    });
  });

  document.getElementById('filterReset').addEventListener('click', function(e) {
    e.stopPropagation();
    diffFilter = { easy: true, medium: true, hard: true };
    statusFilter = { solved: true, unsolved: true };
    document.querySelectorAll('#filterDropdown input').forEach(function(input) {
      input.checked = true;
    });
    syncFilterButton();
    render();
  });

  document.getElementById('pickOneBtn').addEventListener('click', function() {
    pickRandomProblem();
  });

  function getFiltered() {
    var filtered = allProblems.filter(function(p) {
      var isSolved = !!solvedMap[p.id];

      if (!diffFilter[(p.difficulty || 'easy').toLowerCase()]) return false;
      if (!statusFilter[isSolved ? 'solved' : 'unsolved']) return false;

      var searchMatch = !searchQuery ||
        (p.title || '').toLowerCase().includes(searchQuery) ||
        (p.id || '').toLowerCase().includes(searchQuery) ||
        (p.topics || []).some(t => t.toLowerCase().includes(searchQuery));

      var tagMatch = true;
      if (selectedTags.size > 0) {
        tagMatch = false;
        var pTopics = p.topics || [];
        for (let tag of selectedTags) {
          if (pTopics.includes(tag)) {
            tagMatch = true;
            break;
          }
        }
      }

      return searchMatch && tagMatch;
    });

    var sorted = filtered.slice();
    switch (currentSort) {
      case 'diff-asc':
        sorted.sort(function(a, b) {
          return diffOrder[(a.difficulty || 'easy').toLowerCase()] - diffOrder[(b.difficulty || 'easy').toLowerCase()];
        });
        break;
      case 'diff-desc':
        sorted.sort(function(a, b) {
          return diffOrder[(b.difficulty || 'easy').toLowerCase()] - diffOrder[(a.difficulty || 'easy').toLowerCase()];
        });
        break;
      case 'title-asc':
        sorted.sort(function(a, b) { return (a.title || '').localeCompare(b.title || ''); });
        break;
      case 'title-desc':
        sorted.sort(function(a, b) { return (b.title || '').localeCompare(a.title || ''); });
        break;
    }

    return sorted;
  }

  function render() {
    var container = document.getElementById('problemList');
    var headerEl = document.getElementById('listHeader');

    var total = allProblems.length;
    var solvedCount = 0;
    allProblems.forEach(function(p) {
      if (solvedMap[p.id]) solvedCount++;
    });

    document.getElementById('problemsCount').textContent = total;

    var filtered = getFiltered();

    // Update Header Stats
    document.getElementById('statsText').textContent = solvedCount + ' / ' + total + ' Solved';
    var pct = total > 0 ? (solvedCount / total * 100) : 0;
    document.getElementById('progressFill').style.width = pct + '%';

    // Remove old rows (keep header)
    var rows = container.querySelectorAll('.row');
    for (var i = rows.length - 1; i >= 0; i--) {
      rows[i].remove();
    }

    if (filtered.length === 0) {
      headerEl.style.display = 'none';
      var emptyEl = document.createElement('div');
      emptyEl.className = 'empty-state';
      var hasAnyFilter = searchQuery || selectedTags.size > 0 ||
        !diffFilter.easy || !diffFilter.medium || !diffFilter.hard ||
        !statusFilter.solved || !statusFilter.unsolved || currentSort !== 'default';
      emptyEl.innerHTML = hasAnyFilter
        ? '<div class="empty-state-icon">🔍</div><div class="empty-state-title">No problems found</div><div class="empty-state-desc">Try adjusting your search or filters.</div><button class="clear-filters-btn" onclick="resetFilters()">Clear all filters</button>'
        : '<div class="empty-state-icon">📝</div><div class="empty-state-title">No problems loaded</div><div class="empty-state-desc">Problems will appear here once loaded from the data source.</div>';
      container.appendChild(emptyEl);
      return;
    }

    headerEl.style.display = 'flex';
    var fragment = document.createDocumentFragment();

    filtered.forEach(function(p) {
      var row = document.createElement('div');
      var diffClass = (p.difficulty || 'easy').toLowerCase();
      var isSolved = !!solvedMap[p.id];

      row.className = 'row ' + diffClass;
      row.onclick = function() {
        window.openProblemPath(p.path);
      };

      var statusIcon = isSolved
        ? '<svg class="status-icon solved" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><polyline points="20 6 9 17 4 12"/></svg>'
        : '<div class="status-icon unsolved"></div>';

      row.innerHTML = `
        <div class="col-status">${statusIcon}</div>
        <div class="col-title">${escapeHtml(p.title || '')}</div>
        <div class="col-difficulty"><span class="difficulty-badge diff-${diffClass}">${escapeHtml(p.difficulty || 'Easy')}</span></div>
      `;

      fragment.appendChild(row);
    });

    container.appendChild(fragment);
  }

  function escapeHtml(str) {
    return (str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
</script>

</body>
</html>
